function iconoInfo(){
  return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.6v4.2M8 11.1v.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
}

function seccionSala(c, k){
  var s = '<section class="card"><h3>Mapa de participación</h3><div class="sub">Dónde cayeron los turnos de participación</div>';
  var sala = salaDe(c);
  if(!sala) return s + '<p class="vacio">Todavía no armas el mapa de la sala. Se arma desde Ajustes.</p></section>';

  var porAsiento = {}, max = 0, ubicados = 0;
  k.regs.forEach(function(x){
    var a = ACC_BY_ID[x.accionId]; if(!a || a.f !== "par") return;
    var key = x.asiento || asientoDe(c, x.alumnoId);
    if(!key) return;
    porAsiento[key] = (porAsiento[key] || 0) + 1;
    if(porAsiento[key] > max) max = porAsiento[key];
    ubicados++;
  });
  if(!ubicados) return s + '<p class="vacio">Sin turnos de participación con puesto registrado en el periodo.</p></section>';

  s += '<div class="sala-scroll"><div class="sala-grid" style="grid-template-columns:repeat(' + sala.cols + ',minmax(46px,1fr))">';
  for(var fi = sala.filas - 1; fi >= 0; fi--){
    for(var ci = 0; ci < sala.cols; ci++){
      var key = fi + "-" + ci;
      if(!(sala.asientos || {})[key]){ s += '<div class="heat vacio"></div>'; continue; }
      var v = porAsiento[key] || 0;
      var al = max ? v / max : 0;
      var fondo = v ? Math.max(0.09, al) : 0;
      s += '<div class="heat" style="background:rgba(var(--heat-rgb),' + fondo.toFixed(2) + ');color:' + (fondo > 0.55 ? "var(--heat-hi)" : "var(--heat-lo)") + '">' + v + '</div>';
    }
  }
  s += '</div></div><div class="pizarra">Pizarra</div>';
  s += '<div class="leyenda"><span>menos</span><span class="esc">' +
    [0.09,0.3,0.5,0.7,0.9].map(function(a){ return '<i style="background:rgba(var(--heat-rgb),' + a + ')"></i>'; }).join("") +
    '</span><span>más</span></div>';

  function zona(test){
    var n = 0, tot = 0;
    for(var f = 0; f < sala.filas; f++){
      for(var cc = 0; cc < sala.cols; cc++){
        var kk = f + "-" + cc;
        if(!(sala.asientos || {})[kk] || !test(f, cc)) continue;
        n++; tot += porAsiento[kk] || 0;
      }
    }
    return { n:n, prom: n ? tot / n : 0 };
  }
  function prom(z){ return z.n ? (Math.round(z.prom * 10) / 10) : "—"; }

  var c1 = Math.ceil(sala.filas / 3), c2 = Math.ceil(sala.filas * 2 / 3);
  var del = zona(function(f){ return f < c1; });
  var cen = zona(function(f){ return f >= c1 && f < c2; });
  var tra = zona(function(f){ return f >= c2; });
  s += '<div style="margin-top:14px"><div class="eyebrow" style="color:var(--fg-2);margin-bottom:3px">Por distancia a la pizarra</div>' +
    '<p class="dato" style="margin:0">Turnos promedio por estudiante sentado en cada zona</p><div class="zonas">' +
    '<div class="zona"><b>' + prom(del) + '</b><small>Adelante · ' + del.n + ' puestos</small></div>' +
    '<div class="zona"><b>' + prom(cen) + '</b><small>Al medio · ' + cen.n + ' puestos</small></div>' +
    '<div class="zona"><b>' + prom(tra) + '</b><small>Atrás · ' + tra.n + ' puestos</small></div>' +
    '</div></div>';

  var k1 = Math.ceil(sala.cols / 3), k2 = Math.ceil(sala.cols * 2 / 3);
  var izq = zona(function(f, cc){ return cc < k1; });
  var med = zona(function(f, cc){ return cc >= k1 && cc < k2; });
  var der = zona(function(f, cc){ return cc >= k2; });
  s += '<div style="margin-top:13px"><div class="eyebrow" style="color:var(--fg-2);margin-bottom:3px">Por columna</div>' +
    '<div class="zonas">' +
    '<div class="zona"><b>' + prom(izq) + '</b><small>Izquierda · ' + izq.n + ' puestos</small></div>' +
    '<div class="zona"><b>' + prom(med) + '</b><small>Centro · ' + med.n + ' puestos</small></div>' +
    '<div class="zona"><b>' + prom(der) + '</b><small>Derecha · ' + der.n + ' puestos</small></div>' +
    '</div></div>';

  s += '<div class="aviso" style="margin-top:14px">' + iconoInfo() + '<span><b>El mapa muestra dónde pasó, no que el puesto lo haya causado.</b> ' +
    'Adams y Biddle (1970) describieron un centro de actividad que va del frente por la línea central, con la interacción debilitándose al alejarse del profesor, y Sommer encontró más participación en la primera fila y al centro de cada fila. ' +
    'Pero Koneya (1973), asignando asientos al azar, vio que los estudiantes ya identificados como poco verbales no hablaron más por quedar en un puesto de alta participación. ' +
    'Si tus estudiantes eligen dónde sentarse, este mapa te está mostrando dónde se sientan los que ya participaban.</span></div>';

  s += '<p class="dato">Lo que sí tiene respaldo experimental: Daum encontró que, con asientos asignados y controlando el rendimiento previo, los estudiantes de bajo rendimiento previo mejoraron al ubicarlos adelante, mientras que los de alto rendimiento rindieron igual en cualquier parte.</p>';
  return s + '</section>';
}

/* Agrupa por función de la conducta, no por valencia: qué sostiene lo que se ve
   decide qué sirve. Umbrales explícitos y visibles para que el profesor los juzgue. */
function sugerencias(k){
  var orden = k.arr.map(function(o){ return o.turnos; }).sort(function(a,b){ return a-b; });
  var mediana = orden.length ? orden[Math.floor(orden.length / 2)] : 0;
  var g = { g1:[], g2:[], g3:[], g4:[] };
  k.arr.forEach(function(o){
    var conBarrido = o.bar.tot >= 2;
    var malTarea = conBarrido && (o.bar.err + o.bar.no) > o.bar.ok;
    var disruptivo = (o.fdt + o.aten) >= 3;
    if(malTarea){ g.g4.push(o); return; }
    if(disruptivo){ g.g3.push(o); return; }
    if(o.turnos < mediana || o.turnos === 0){ g.g2.push(o); return; }
    o.rec = (o.acc["p-vol-err"]||0) + (o.acc["p-preg"]||0) + (o.acc["e-explica"]||0) + (o.acc["e-aplica"]||0);
    g.g1.push(o);
  });
  g.mediana = mediana;
  return g;
}

function grupoCard(titulo, tok, accion, evidencia, lista, razon){
  var s = '<section class="card"><div class="fam-head"><i style="background:var(--' + tok + '-dot)"></i>' +
    '<h3>' + h(titulo) + '</h3></div>' +
    '<p class="dato" style="margin:6px 0 0 17px"><b>Qué hacer:</b> ' + accion + '</p>' +
    '<p class="dato" style="margin:5px 0 10px 17px">' + evidencia + '</p>';
  if(!lista.length) return s + '<p class="vacio">Nadie en este grupo en el periodo.</p></section>';
  lista.slice(0, 8).forEach(function(o){
    s += '<div class="row"><i style="background:var(--' + tok + '-dot)"></i><b>' + h(o.n) + '</b><small>' + h(razon(o)) + '</small></div>';
  });
  if(lista.length > 8) s += '<p class="dato">y ' + (lista.length - 8) + ' más.</p>';
  return s + '</section>';
}

function seccionSugerencias(k){
  if(!k.nRegs && !k.barridos.length){
    return '<section class="card"><h3>Sugerencia de acción</h3>' +
      '<div class="sub">Agrupados por qué sostiene la conducta, no por si es buena o mala</div>' +
      '<p class="vacio">Sin registros en el periodo. Con una o dos clases registradas ya aparecen los grupos.</p></section>';
  }
  var g = sugerencias(k);
  var total = k.arr.length;
  var apoyo = g.g3.length + g.g4.length;
  var pct = total ? Math.round(apoyo / total * 100) : 0;

  var s = '<section class="card"><h3>Sugerencia de acción</h3>' +
    '<div class="sub">Agrupados por qué sostiene la conducta, no por si es buena o mala</div>' +
    '<div class="aviso">' + iconoInfo() + '<span>Los grupos salen de umbrales fijos, y un estudiante sin ningún registro cuenta como invisible, no como sin datos. ' +
    'Poca participación es estar bajo la mediana del curso, que en este periodo fue de <b>' + g.mediana + '</b> turnos. ' +
    'Patrón disruptivo es acumular 3 o más registros entre fuera de tarea y llamados de atención. ' +
    'La tarea se evalúa solo con 2 o más barridos.</span></div></section>';

  s += grupoCard("Reconocer", "ok",
    "Elogio específico nombrando la conducta concreta, y proponerlos para los reconocimientos del colegio.",
    "Participan y, cuando revisas, la tarea les sale. El elogio que tiene respaldo es el que nombra la conducta, no el general.",
    g.g1.sort(function(a,b){ return (b.rec||0) - (a.rec||0) || b.turnos - a.turnos; }),
    function(o){
      var p = [o.turnos + " turnos"];
      if(o.acc["p-vol-err"] || o.acc["p-preg"]) p.push("participa aunque se equivoque");
      if(o.acc["e-explica"]) p.push("explica a compañeros");
      if(o.bar.ok) p.push(o.bar.ok + " veces la tarea correcta");
      return p.join(" · ");
    });

  s += grupoCard("Darle más turnos", "av",
    "Aumentar las oportunidades de respuesta dirigidas. La franja de prioridad ya lo hace: úsala.",
    "No aparecen en los registros, pero cuando trabajan lo hacen bien. No es conducta: no les está llegando el turno. Una revisión de 15 estudios halló apoyo creciente para esta práctica a nivel de curso, con más conducta en tarea y más participación; los estudios con resultados positivos usaron entre 3 y 5 oportunidades por minuto, y ninguno identificó una tasa óptima.",
    g.g2.sort(function(a,b){ return a.turnos - b.turnos; }),
    function(o){
      return o.turnos === 0 ? "sin participar en el periodo" : o.turnos + " turnos, bajo la mediana de " + g.mediana;
    });

  s += grupoCard("Apoyo conductual estructurado", "err",
    "Monitoreo diario con retroalimentación pautada, del tipo check-in y check-out.",
    "Interrumpen o se desconectan, pero cuando trabajan les sale bien: la conducta no viene de no saber. El check-in/check-out está revisado como práctica basada en evidencia dentro de PBIS y es especialmente efectivo cuando la conducta se mantiene por la atención del adulto.",
    g.g3.sort(function(a,b){ return (b.fdt + b.aten) - (a.fdt + a.aten); }),
    function(o){
      var p = [o.fdt + " fuera de tarea"];
      if(o.aten) p.push(o.aten + " llamados de atención");
      if(o.bar.ok) p.push("pero la tarea le sale " + o.bar.ok + " de " + o.bar.tot);
      return p.join(" · ");
    });

  s += grupoCard("No es conducta, es la tarea", "no",
    "Apoyo académico: revisar el prerrequisito, no la conducta.",
    "No empiezan, o terminan con errores. Esta es la distinción que importa: la evidencia del check-in/check-out cubre la conducta mantenida por atención y no dice nada sobre la que busca escapar de la tarea. Aplicarles esa herramienta es equivocarse de problema.",
    g.g4.sort(function(a,b){ return (b.bar.err + b.bar.no) - (a.bar.err + a.bar.no); }),
    function(o){
      var p = [];
      if(o.bar.err) p.push(o.bar.err + " veces terminó con errores");
      if(o.bar.no) p.push(o.bar.no + " veces no empezó");
      p.push("de " + o.bar.tot + " revisiones");
      return p.join(" · ");
    });

  s += '<section class="card"><h3>Control de cordura</h3>' +
    '<div class="sub">Si demasiados caen en los dos últimos grupos, el problema no son ellos</div>' +
    '<p class="dato">En PBIS se espera que cerca del <b>80%</b> responda al nivel universal, entre <b>10 y 15%</b> necesite apoyo de nivel 2 y alrededor del <b>5%</b> requiera intervención individualizada.</p>' +
    '<div class="stats" style="margin-top:10px">' +
    stat(pct + "%", "del curso en los dos grupos de apoyo", pct > 15 ? "err" : "ok") +
    stat(apoyo + " de " + total, "estudiantes", "av") + '</div>';
  if(pct > 15) s += '<div class="alerta">' + iconoInfo() + '<span><b>Son más de los esperables.</b> Antes de armar apoyos individuales, mira qué pasa en el nivel universal: cómo repartes los turnos, en qué fase se cae la clase, y si la tarea está al nivel del curso.</span></div>';
  return s + '</section>';
}

function seccionBarridos(k){
  var s = '<section class="card"><h3>Práctica autónoma</h3>' +
    '<div class="sub">' + k.barridos.length + (k.barridos.length === 1 ? " barrido" : " barridos") + ' en el periodo</div>';
  if(!k.barridos.length){
    return s + '<p class="vacio">Todavía no has hecho barridos. El botón sale en las fases de Acompañamiento y Autonomía.</p></section>';
  }
  var revisados = k.arr.filter(function(o){ return o.bar.tot; });
  s += barras(BARRIDO.map(function(b){ return { n:b.t, v:k.barTot[b.id] }; }), "av", 4);
  s += '<p class="dato">' + revisados.length + ' de ' + k.arr.length + ' estudiantes fueron revisados al menos una vez. ' +
    'Los demás no aparecen porque no alcanzaste a mirarlos, no porque no trabajaran.</p>';

  var conError = k.arr.filter(function(o){ return o.bar.err > 0 && o.bar.err >= o.bar.ok; })
    .sort(function(a,b){ return b.bar.err - a.bar.err; }).slice(0, 6);
  if(conError.length){
    s += '<div style="margin-top:14px"><div class="eyebrow" style="color:var(--err-ink);margin-bottom:3px">Terminan, pero con errores</div>' +
      '<p class="dato" style="margin:0 0 7px">Este es el grupo que se escapa: alcanzan a terminar, así que a simple vista parecen bien.</p>' +
      barras(conError.map(function(o){ return { n:o.n, v:o.bar.err, d:o.bar.ok + " veces correcto · " + o.bar.err + " con errores" }; }), "err") + '</div>';
  }
  var noEmp = k.arr.filter(function(o){ return o.bar.no >= 2; }).sort(function(a,b){ return b.bar.no - a.bar.no; }).slice(0, 6);
  if(noEmp.length){
    s += '<div style="margin-top:14px"><div class="eyebrow" style="color:var(--no-ink);margin-bottom:7px">No empezó, en más de un barrido</div>' +
      barras(noEmp.map(function(o){ return { n:o.n, v:o.bar.no, d:"de " + o.bar.tot + " veces revisado" }; }), "no") + '</div>';
  }
  return s + '</section>';
}

      '</div>';

        '<button type="button" class="btn sm" data-act="nomina-pegar-ok" style="margin-top:7px;align-self:flex-start">Agregar los de la lista</button>';
    }
    s += '<div style="display:flex;gap:7px;margin-top:9px"><input type="text" id="f-add" placeholder="Nombre del estudiante">' +
      '<button type="button" class="btn sm accent" data-act="nomina-add" style="flex:none">Agregar</button></div>';
    s += '<div class="nomina">';
    if(!lista.length) s += '<p class="nomina-vacia">Todavía no hay estudiantes. Sube un CSV o agrégalos de a uno.</p>';
    lista.forEach(function(a, i){
      s += '<div class="nom-row"><span class="n">' + (i+1) + '</span>' +

        var al = alumno(c, aid); if(!al) return;

      });

        s += '<button type="button" class="prio-chip" style="border-color:var(--orange)" data-act="premio" data-k="' + p.id + '" data-id="' + al.id + '">' + h(corto(al.nombre)) + '</button>';

    s += '<button type="button" class="btn wide" data-act="cerrar-modal">Listo</button>';
  }
  else if(modal.m === "puesto"){
    var pk = modal.k.split("-");
    var sala2 = salaDe(c) || { asientos:{} };
    var actual = (sala2.asientos || {})[modal.k];
    s += '<div style="font-size:12.5px;color:var(--fg-2);margin-top:-4px">Fila ' + (+pk[0]+1) + ', columna ' + (+pk[1]+1) + ', contando desde la pizarra</div>';
    if(actual) s += '<button type="button" class="btn ghost wide" data-act="sala-set" data-k="' + modal.k + '" data-id="">Dejar el puesto vacío</button>';
    s += '<div style="display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto">';
    alumnosDe(c).forEach(function(a){
      var suyo = asientoDe(c, a.id);
      s += '<button type="button" class="opt" aria-current="' + (actual === a.id ? "true":"false") + '" data-act="sala-set" data-k="' + modal.k + '" data-id="' + a.id + '">' +
        '<span style="flex:1;min-width:0">' + h(a.nombre) +
        (suyo && suyo !== modal.k ? '<small style="display:block;font-weight:400;font-size:11.5px;color:var(--fg-2)">hoy está en ' + (+suyo.split("-")[0]+1) + '·' + (+suyo.split("-")[1]+1) + ', se mueve acá</small>' : '') +
        '</span></button>';
    });
    s += '</div><button type="button" class="btn ghost wide" data-act="cerrar-modal">Cancelar</button>';
  }
  else if(modal.m === "restaurar"){
    if(APP_PROPIA) s += '<label class="btn ghost wide file-label" for="f-bak">Elegir el archivo de respaldo' +
      '<input type="file" id="f-bak" accept=".json,application/json"></label>';
    s += '<div class="field"><label for="f-restore">' + (APP_PROPIA ? 'O pega aquí el texto del respaldo' : 'Pega aquí el texto del respaldo') + '</label><textarea id="f-restore" placeholder="{...}"></textarea></div>';
    s += '<div style="font-size:12px;color:var(--danger)">Esto reemplaza todo lo que tienes guardado en este dispositivo.</div>';
    s += '<div class="btn-row"><button type="button" class="btn accent" data-act="restaurar">Reemplazar mis datos</button>' +
      '<button type="button" class="btn ghost" data-act="cerrar-modal">Cancelar</button></div>';
  }
  else if(modal.m === "confirmar"){
    s += '<div style="font-size:13.5px;color:var(--fg-2)">' + h(modal.texto) + '</div>';
    s += '<div class="btn-row"><button type="button" class="btn accent" data-act="' + modal.accion + '" data-id="' + h(modal.id||"") + '" data-ok="1">' + h(modal.ok) + '</button>' +
      '<button type="button" class="btn ghost" data-act="cerrar-modal">Cancelar</button></div>';
  }
  s += '</div></div></div>';
  return s;
}

/* ========== eventos ========== */
function val(id){ var el = document.getElementById(id); return el ? el.value : ""; }
function limpiaNombre(n){
  return String(n||"").replace(/\s+/g," ").replace(/^\s*\d+\s*[\.\)\-]\s*/,"").replace(/^,+|,+$/g,"").trim();
}
function esNombre(n){
  if(!n || n.length < 3) return false;
  if(/^[\d.\-kK\s]+$/.test(n)) return false;
  if(/^(n|n°|nro|num|numero|número|rut|run|curso|nombre|nombres|apellido|apellidos|alumno|alumnos|estudiante|estudiantes|lista|total)\b/i.test(n)) return false;
  return /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2}/.test(n);
}
function celdasCSV(linea, delim){
  var out = [], cur = "", q = false;
  for(var i = 0; i < linea.length; i++){
    var ch = linea.charAt(i);
    if(ch === '"'){ if(q && linea.charAt(i+1) === '"'){ cur += '"'; i++; } else q = !q; }
    else if(ch === delim && !q){ out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(function(x){ return x.replace(/\s+/g," ").trim(); });
}
function mejorColumna(filas, ncol){
  var mejor = 0, score = -1;
  for(var i = 0; i < ncol; i++){
    var s = 0;
    filas.forEach(function(f){
      var v = (f[i] || "").trim();
      if(!v || /^[\d.\-kK\s]+$/.test(v)) return;
      if(!/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{3}/.test(v)) return;
      s += Math.min(3, v.split(" ").length);
    });
    if(s > score){ score = s; mejor = i; }
  }
  return mejor;
}
function parseCSVNombres(txt){
  var lineas = String(txt||"").replace(/^﻿/,"").split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(!lineas.length) return [];
  var delim = ";", mejorN = 0;
  [";", ",", "\t", "|"].forEach(function(d){
    var n = celdasCSV(lineas[0], d).length;
    if(n > mejorN){ mejorN = n; delim = d; }
  });
  var filas = lineas.map(function(l){ return celdasCSV(l, delim); });
  var ncol = filas.reduce(function(m,f){ return Math.max(m, f.length); }, 1);
  if(ncol === 1) return filas.map(function(f){ return limpiaNombre(f[0]); }).filter(esNombre);

  var cab = filas[0].map(function(x){ return x.toLowerCase(); });
  var tieneCab = cab.some(function(x){ return /nombre|apellido|alumno|estudiante|rut|run/.test(x); });
  var cuerpo = tieneCab ? filas.slice(1) : filas;
  if(!cuerpo.length) return [];
  var aps = [], idxNo = -1, idxUno = -1;
  if(tieneCab){
    cab.forEach(function(x, i){
      if(/apellido/.test(x)) aps.push(i);
      if(/nombre/.test(x) && !/completo/.test(x) && idxNo === -1) idxNo = i;
      if(/(nombre completo|alumno|estudiante)/.test(x) && idxUno === -1) idxUno = i;
    });
  }
  if(aps.length && idxNo > -1 && aps.indexOf(idxNo) === -1){
    return cuerpo.map(function(f){
      var ap = aps.map(function(i){ return (f[i]||"").trim(); }).filter(Boolean).join(" ");
      var no = (f[idxNo] || "").trim();
      return limpiaNombre(ap && no ? ap + ", " + no : (ap || no));
    }).filter(esNombre);
  }
  var col = idxUno > -1 ? idxUno : (idxNo > -1 ? idxNo : mejorColumna(cuerpo, ncol));
  return cuerpo.map(function(f){ return limpiaNombre(f[col] || ""); }).filter(esNombre);
}
function parseNomina(txt){
  var vistos = {};
  return String(txt||"").split(/\r?\n/).map(function(l){ return limpiaNombre(l.replace(/\t/g," ")); })
    .filter(function(l){
      if(!esNombre(l)) return false;
      var k = l.toLowerCase();
      if(vistos[k]) return false;
      vistos[k] = true; return true;
    });
}
function sincronizarNomina(){
  if(!modal || !modal.nomina) return;
  Array.prototype.forEach.call(document.querySelectorAll("[data-nom]"), function(el){
    var i = +el.getAttribute("data-nom");
    if(modal.nomina[i]) modal.nomina[i].nombre = el.value;
  });
}
function agregarNombres(nombres){
  if(!modal || !modal.nomina) return 0;
  sincronizarNomina();
  var vistos = {};
  modal.nomina.forEach(function(a){ vistos[String(a.nombre).trim().toLowerCase()] = true; });
  var n = 0;
  nombres.forEach(function(x){
    var k = x.trim().toLowerCase();
    if(!k || vistos[k]) return;
    vistos[k] = true; modal.nomina.push({ id:uid(), nombre:x }); n++;
  });
  return n;
}
function aplicarCSV(txt){
  var nombres = parseCSVNombres(txt);
  if(!nombres.length){
    toast("No encontré nombres en ese archivo. Revisa que tenga una columna con los nombres.", null); render(); return;
  }
  var n = agregarNombres(nombres);
  toast(n ? "Se agregaron " + n + " estudiantes. Revísalos antes de guardar." : "Esos nombres ya estaban en la lista.", null);
  render();
}
function leerCSV(file){
  var fr = new FileReader();
  fr.onerror = function(){ toast("No se pudo leer el archivo.", null); render(); };
  fr.onload = function(){
    var txt = String(fr.result || "");
    if(txt.indexOf(String.fromCharCode(65533)) > -1){
      var fr2 = new FileReader();
      fr2.onload = function(){ aplicarCSV(String(fr2.result || "")); };
      fr2.onerror = function(){ aplicarCSV(txt); };
      try{ fr2.readAsText(file, "windows-1252"); return; }catch(e){}
    }
    aplicarCSV(txt);
  };
  try{ fr.readAsText(file, "UTF-8"); }catch(e){ toast("No se pudo leer el archivo.", null); render(); }
}
function aplicarNomina(c, lista){
  var vistos = {};
  c.estudiantes = lista.map(function(a){ return { id:a.id || uid(), nombre:limpiaNombre(a.nombre) }; })
    .filter(function(a){
      if(!a.nombre) return false;
      var k = a.nombre.toLowerCase();
      if(vistos[k]) return false;
      vistos[k] = true; return true;
    });
}

document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act]");
  if(!t){
    if(ev.target.closest(".modal")) return;
    return;
  }
  var act = t.getAttribute("data-act");
  var id = t.getAttribute("data-id");
  var c = curso();

  if(act === "ir"){
    guardarNotasVisibles();
    vista = t.getAttribute("data-v"); sheetAlumno = null; modal = null; cerrarToast(); render();
    var sec = t.getAttribute("data-sec");
    if(sec){ var el = document.getElementById(sec); if(el) el.scrollIntoView({ block:"start" }); }
    else window.scrollTo(0,0);
    return;
  }
  if(act === "abrir"){ sheetAlumno = id; cerrarToast(); render(); return; }
  if(act === "cerrar-hoja"){ sheetAlumno = null; render(); return; }
  if(act === "reg"){ registrar(id, t.getAttribute("data-a")); return; }
  if(act === "deshacer"){ deshacer(id); return; }
  if(act === "cerrar-aviso"){ avisoRespaldo = false; render(); return; }
  if(act === "periodo"){ periodo = t.getAttribute("data-p"); render(); window.scrollTo(0,0); return; }
  if(act === "modo-lista"){ DB.config.vistaSala = false; guardar(); render(); return; }
  if(act === "modo-sala"){ DB.config.vistaSala = true; guardar(); render(); return; }
  if(act === "sala-mas" || act === "sala-menos"){
    c.sala = c.sala || { filas:5, cols:6, asientos:{} };
    var campo = t.getAttribute("data-k");
    var d = act === "sala-mas" ? 1 : -1;
    c.sala[campo] = Math.max(1, Math.min(12, c.sala[campo] + d));
    Object.keys(c.sala.asientos).forEach(function(k){
      var p = k.split("-");
      if(+p[0] >= c.sala.filas || +p[1] >= c.sala.cols) delete c.sala.asientos[k];
    });
    guardar(); render(); return;
  }
  if(act === "sala-llenar"){
    c.sala = c.sala || { filas:5, cols:6, asientos:{} };
    c.sala.asientos = {};
    var lista = alumnosDe(c), i = 0;
    for(var fi = 0; fi < c.sala.filas && i < lista.length; fi++){
      for(var ci = 0; ci < c.sala.cols && i < lista.length; ci++){ c.sala.asientos[fi + "-" + ci] = lista[i++].id; }
    }
    guardar(); render();
    if(i < lista.length) toast("La sala es chica para el curso: " + (lista.length - i) + " quedaron sin puesto.", null), render();
    return;
  }
  if(act === "sala-vaciar"){
    if(!t.getAttribute("data-ok")){
      modal = { m:"confirmar", titulo:"Vaciar el mapa", texto:"Se borran todas las asignaciones de puesto. Los registros ya guardados no se tocan.", ok:"Vaciar", accion:"sala-vaciar" };
      render(); return;
    }
    if(c.sala) c.sala.asientos = {};
    guardar(); modal = null; render(); return;
  }
  if(act === "sala-puesto"){ modal = { m:"puesto", k:t.getAttribute("data-k"), titulo:"Asignar puesto" }; render(); return; }
  if(act === "sala-set"){
    var kk = t.getAttribute("data-k");
    c.sala = c.sala || { filas:5, cols:6, asientos:{} };
    if(id){
      Object.keys(c.sala.asientos).forEach(function(x){ if(c.sala.asientos[x] === id) delete c.sala.asientos[x]; });
      c.sala.asientos[kk] = id;
    } else delete c.sala.asientos[kk];
    guardar(); modal = null; render(); return;
  }
  if(act === "barrido-ini"){ barrido = { marcas:{}, pincel:"ok" }; cerrarToast(); render(); window.scrollTo(0,0); return; }
  if(act === "pincel"){ barrido.pincel = id; render(); return; }
  if(act === "barrido-marca"){
    if(barrido.marcas[id] === barrido.pincel) delete barrido.marcas[id];
    else barrido.marcas[id] = barrido.pincel;
    render(); return;
  }
  if(act === "barrido-cancel"){
    if(Object.keys(barrido.marcas).length && !t.getAttribute("data-ok")){
      modal = { m:"confirmar", titulo:"Descartar el barrido", texto:"Marcaste " + Object.keys(barrido.marcas).length + " estudiantes. Si sales ahora se pierde.", ok:"Descartar", accion:"barrido-cancel" };
      render(); return;
    }
    barrido = null; modal = null; render(); window.scrollTo(0,0); return;
  }
  if(act === "barrido-ok"){
    var clB = asegurarClase();
    DB.barridos.push({ id:uid(), cursoId:c.id, claseId:clB.id, fase:clB.fase, ts:Date.now(), marcas:barrido.marcas });
    var nM = Object.keys(barrido.marcas).length;
    guardar(); barrido = null; render(); window.scrollTo(0,0);
    toast("Barrido guardado: " + nM + (nM === 1 ? " estudiante revisado" : " estudiantes revisados") + ".", null); render();
    return;
  }
  if(act === "saltar-inicio"){
    DB.config.mostrarInicio = false; guardar();
    vista = DB.cursos.length ? "clase" : "config"; render(); window.scrollTo(0,0);
    toast("Listo. Puedes volver a activarla en Ajustes.", null); render(); return;
  }
  if(act === "modal"){
    modal = { m:t.getAttribute("data-m"), id:id };
    modal.titulo = { fase:"Fase de la clase", curso:"Cambiar de curso", "nuevo-curso":"Nuevo curso",
      "editar-curso":"Editar curso", premios:"Reconocimientos de la semana", restaurar:"Restaurar un respaldo" }[modal.m] || "";
    if(modal.m === "fase") modal.sub = "La fase queda guardada en cada registro.";
    if(modal.m === "nuevo-curso") modal.nomina = [];
    if(modal.m === "editar-curso"){
      var cx = DB.cursos.filter(function(x){ return x.id === id; })[0];
      modal.nomina = cx ? alumnosDe(cx).map(function(a){ return { id:a.id, nombre:a.nombre }; }) : [];
    }
    render(); return;
  }
  if(act === "cerrar-modal"){
    if(t.classList.contains("modal-bg") && ev.target.closest("[data-stop]")) return;
    modal = null; render(); return;
  }
  if(act === "nomina-add"){
    var el = document.getElementById("f-add");
    var nom = limpiaNombre(el ? el.value : "");
    if(!nom){ if(el) el.focus(); return; }
    agregarNombres([nom]);
    focoPendiente = "f-add"; render(); return;
  }
  if(act === "nomina-del"){
    sincronizarNomina();
    modal.nomina.splice(+t.getAttribute("data-i"), 1);
    render(); return;
  }
  if(act === "nomina-pegar"){ sincronizarNomina(); modal.pegar = !modal.pegar; focoPendiente = modal.pegar ? "f-pegar" : null; render(); return; }
  if(act === "nomina-pegar-ok"){
    var n = agregarNombres(parseNomina(val("f-pegar")));
    modal.pegar = false;
    toast(n ? "Se agregaron " + n + " estudiantes." : "No encontré nombres nuevos en ese texto.", null);
    render(); return;
  }
  if(act === "fase-next"){
    var cl = asegurarClase();
    var i = FASES.map(function(f){ return f.id; }).indexOf(cl.fase);
    cl.fase = FASES[Math.min(FASES.length-1, i+1)].id; guardar(); render(); return;
  }
  if(act === "set-fase"){ var cl2 = asegurarClase(); cl2.fase = id; guardar(); modal = null; render(); return; }
  if(act === "grupal"){ var cl3 = asegurarClase(); cl3.grupal = !cl3.grupal; guardar(); render(); return; }
  if(act === "set-curso"){ DB.cursoActivo = id; guardar(); modal = null; vista = "clase"; render(); window.scrollTo(0,0); return; }
  if(act === "toggle"){ var k = t.getAttribute("data-k"); DB.config[k] = !DB.config[k]; guardar(); render(); return; }

  if(act === "crear-curso"){
    var nomC = val("f-nombre").trim();
    if(!nomC){ toast("Ponle un nombre al curso.", null); render(); return; }
    sincronizarNomina();
    var nuevo = { id:uid(), nombre:nomC, asignatura:val("f-asig").trim(), estudiantes:[] };
    aplicarNomina(nuevo, modal.nomina || []);
    DB.cursos.push(nuevo); DB.cursoActivo = nuevo.id; guardar();
    modal = null; vista = nuevo.estudiantes.length ? "clase" : "config"; render(); window.scrollTo(0,0);
    if(!nuevo.estudiantes.length) toast("Curso creado, pero sin estudiantes. Agrégalos desde Editar.", null);
    return;
  }
  if(act === "guardar-curso"){
    var cc = DB.cursos.filter(function(x){ return x.id === id; })[0]; if(!cc) return;
    sincronizarNomina();
    cc.nombre = val("f-nombre").trim() || cc.nombre;
    cc.asignatura = val("f-asig").trim();
    aplicarNomina(cc, modal.nomina || []);
    guardar(); modal = null; render(); return;
  }
  if(act === "borrar-curso"){
    if(!t.getAttribute("data-ok")){
      modal = { m:"confirmar", titulo:"Eliminar el curso", texto:"Se borran el curso, su nómina y todos sus registros de este dispositivo. No se puede deshacer.", ok:"Eliminar", accion:"borrar-curso", id:id };
      render(); return;
    }
    DB.registros = DB.registros.filter(function(r){ return r.cursoId !== id; });
    DB.clases = DB.clases.filter(function(x){ return x.cursoId !== id; });
    DB.cursos = DB.cursos.filter(function(x){ return x.id !== id; });
    Object.keys(DB.semanas).forEach(function(k){ if(k.indexOf(id + "|") === 0) delete DB.semanas[k]; });
    if(DB.cursoActivo === id) DB.cursoActivo = DB.cursos.length ? DB.cursos[0].id : null;
    guardar(); modal = null; vista = "config"; render(); return;
  }
  if(act === "cerrar-clase"){
    guardarNotasVisibles();
    var cl4 = asegurarClase();
    var pend = regsDeClase(cl4.id).filter(function(r){ var a = ACC_BY_ID[r.accionId]; return a && a.otro && !String(r.nota||"").trim(); });
    if(pend.length){ toast("Faltan " + pend.length + " descripciones.", null); render(); return; }
    cl4.cerrada = true; guardar(); vista = "clase"; render(); window.scrollTo(0,0);
    toast("Clase cerrada. La próxima parte en blanco.", null); render();
    return;
  }
  if(act === "premio"){ fijarPremio(c, t.getAttribute("data-k"), id || null); return; }
  if(act === "copiar-csv"){ DB.config.ultimoRespaldo = DB.config.ultimoRespaldo || null; copiar(csv(), "csv"); return; }
  if(act === "copiar-bak"){ DB.config.ultimoRespaldo = Date.now(); guardar(); copiar(JSON.stringify(DB), "bak"); return; }
  if(act === "bajar-bak"){ DB.config.ultimoRespaldo = Date.now(); guardar(); descargar(nombreArchivo("json"), JSON.stringify(DB), "application/json"); return; }
  if(act === "compartir-bak"){ DB.config.ultimoRespaldo = Date.now(); guardar(); compartir(nombreArchivo("json"), JSON.stringify(DB), "application/json"); return; }
  if(act === "bajar-csv"){ descargar(nombreArchivo("csv"), "\ufeff" + csv(), "text/csv;charset=utf-8"); return; }
  if(act === "restaurar"){
    var txt = val("f-restore").trim();
    try{
      var d = JSON.parse(txt);
      if(!d || !d.cursos) throw new Error("formato");
      DB = normalizar(d); guardar(); modal = null; vista = DB.cursos.length ? "clase" : "config"; render();
      toast("Datos restaurados.", null); render();
    }catch(e){ toast("Ese texto no es un respaldo válido.", null); render(); }
    return;
  }
  if(act === "ejemplo"){
    var nombres = ["Agustín Barraza","Antonia Castro","Benjamín Rojas","Bruno Kast","Catalina Vera","Diego Muñoz","Emilia Salas","Facundo Ortiz","Florencia Lagos","Gabriel Tapia","Ignacio Peña","Isidora Nieto","Joaquín Araya","Josefa Pino","Lucas Guzmán","Magdalena Riquelme","Martín Escobar","Martina Soto","Matías Quiroz","Paz Herrera","Renato Fuentes","Sofía Zúñiga","Tomás Ibáñez","Valentina Díaz"];
    var ej = { id:uid(), nombre:"6°A (ejemplo)", asignatura:"Matemática", estudiantes:nombres.map(function(n){ return { id:uid(), nombre:n }; }) };
    DB.cursos.push(ej); DB.cursoActivo = ej.id; guardar(); vista = "clase"; render(); window.scrollTo(0,0);
    toast("Curso de ejemplo cargado. Bórralo desde Ajustes cuando quieras.", null); render();
    return;
  }
}, false);

document.addEventListener("keydown", function(ev){
  if(ev.key === "Enter" && ev.target && ev.target.id === "f-add"){
    ev.preventDefault();
    var nom = limpiaNombre(ev.target.value);
    if(!nom) return;
    agregarNombres([nom]);
    focoPendiente = "f-add"; render();
  }
}, false);

document.addEventListener("change", function(ev){
  var el = ev.target;
  if(el.id === "f-csv" && el.files && el.files[0]){ leerCSV(el.files[0]); el.value = ""; return; }
  if(el.id === "f-bak" && el.files && el.files[0]){
    var fr = new FileReader();
    fr.onload = function(){ var t = document.getElementById("f-restore"); if(t) t.value = String(fr.result || ""); toast("Archivo leído. Revisa y confirma abajo.", null); render(); };
    fr.onerror = function(){ toast("No se pudo leer el archivo.", null); render(); };
    fr.readAsText(el.files[0], "UTF-8"); el.value = ""; return;
  }
  if(el.getAttribute && el.getAttribute("data-nom") !== null) return;
  if(el.getAttribute && el.getAttribute("data-cfg") === "meta"){ DB.config.meta = Math.max(1, +el.value || 250); guardar(); }
  if(el.getAttribute && el.getAttribute("data-et")){
    var k = el.getAttribute("data-et");
    DB.config.etiquetas[k] = el.value.trim() || null;
    if(!DB.config.etiquetas[k]) delete DB.config.etiquetas[k];
    if(k === "principal") DB.config.etiquetaPrincipal = el.value.trim() || "Matemático de la semana";
    guardar();
  }
}, false);

document.addEventListener("input", function(ev){
  var el = ev.target;
  var ni = el.getAttribute && el.getAttribute("data-nom");
  if(ni !== null && ni !== undefined && modal && modal.nomina && modal.nomina[+ni]){
    modal.nomina[+ni].nombre = el.value; return;
  }
  var rid = el.getAttribute && el.getAttribute("data-nota");
  if(rid){
    var r = DB.registros.filter(function(x){ return x.id === rid; })[0];
    if(r){ r.nota = el.value; guardar(); }
  }
}, false);

function guardarNotasVisibles(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-nota]"), function(el){
    var r = DB.registros.filter(function(x){ return x.id === el.getAttribute("data-nota"); })[0];
    if(r) r.nota = el.value;
  });
  guardar();
}

/* ========== arranque ========== */
DB = cargar();
if(!DB.cursoActivo && DB.cursos.length) DB.cursoActivo = DB.cursos[0].id;
vista = (DB.config.mostrarInicio === false && DB.cursos.length) ? "clase" : "inicio";
render();

if(APP_PROPIA && navigator.serviceWorker){
  window.addEventListener("load", function(){
    try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
  });
}
})();
</script>
