<meta name="claude:viewport-fit-sides" content="cover">
<title>Turnos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F4634">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turnos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500..700&family=Work+Sans:wght@400..700&display=swap">
<style>
/* Layout: una columna en el teléfono, cabecera fija con la fase, grilla del curso de 4 columnas,
   hoja de acciones por familia, y una vista aparte de ancho completo para proyectar. */
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#E3EDE7; --line:#D6E0D9;
  --fg:#1F2421; --fg-2:#6E6A5F; --fg-3:#8A8578;
  --navy:#0F4634; --navy-2:#0B3729; --on-navy:#FBFAF7; --on-navy-2:#B9CFC3; --on-navy-3:#93B2A2;
  --orange:#C8952F; --on-orange:#2A1F08; --orange-ink:#7A5310; --orange-wash:#F8EEDA; --orange-line:#E7D5AE;
  --par-wash:#E3EDE7; --par-ink:#0B3D2D; --par-dot:#17604A;
  --fdt-wash:#F8EEDA; --fdt-ink:#7A5310; --fdt-dot:#A8741A;
  --doc-wash:#F7E8ED; --doc-ink:#76283F; --doc-dot:#9B3F5C;
  --pares-wash:#E2EFF7; --pares-ink:#154E74; --pares-dot:#1E6FA3;
  --danger:#A32B22; --band:#0F4634;
  --verde:#0F4634; --verde-ink:#0F4634; --verde-btn:#0F4634; --on-verde:#FBFAF7;
  --heat-rgb:15,70,52; --heat-hi:#FBFAF7; --heat-lo:#1F2421;
  --logo-bg:transparent; --logo-pad:0px; --logo-shift:-17.6%;
  --ok-dot:#2E7D52; --ok-wash:#E3F0E8; --ok-ink:#1C5737;
  --err-dot:#A8741A; --err-wash:#F8EEDA; --err-ink:#7A5310;
  --av-dot:#1E6FA3; --av-wash:#E2EFF7; --av-ink:#154E74;
  --no-dot:#8A8578; --no-wash:#EFEDE7; --no-ink:#5A564C;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"Work Sans",-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;
  --r:14px; --r-sm:10px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121714; --surface:#1A211C; --surface-2:#242D26; --line:#354037;
  --fg:#FBFAF7; --fg-2:#A9A79A; --fg-3:#8A8578;
  --navy:#16221D; --navy-2:#1F2C25; --on-navy:#FBFAF7; --on-navy-2:#A6C2B2; --on-navy-3:#8AA897;
  --orange:#E0B458; --on-orange:#201706; --orange-ink:#F0CE8C; --orange-wash:#33280F; --orange-line:#4A3C1E;
  --par-wash:#16332A; --par-ink:#A7D4BE; --par-dot:#5FA886;
  --fdt-wash:#33280F; --fdt-ink:#F0CE8C; --fdt-dot:#E0B458;
  --doc-wash:#331F27; --doc-ink:#F0B9C9; --doc-dot:#D1819A;
  --pares-wash:#132D3D; --pares-ink:#A9D4EE; --pares-dot:#5FA8D4;
  --danger:#FF9A92; --band:#16221D;
  --verde:#5FA886; --verde-ink:#8FD4B2; --verde-btn:#5FA886; --on-verde:#0A1A13;
  --heat-rgb:111,184,148; --heat-hi:#121714; --heat-lo:#FBFAF7;
  --logo-bg:#FBFAF7; --logo-pad:16px 20px;
  --ok-dot:#6FC694; --ok-wash:#12301F; --ok-ink:#A8E6C2;
  --err-dot:#E0B458; --err-wash:#33280F; --err-ink:#F0CE8C;
  --av-dot:#5FA8D4; --av-wash:#132D3D; --av-ink:#A9D4EE;
  --no-dot:#A9A79A; --no-wash:#242D26; --no-ink:#CFCCC1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121714; --surface:#1A211C; --surface-2:#242D26; --line:#354037;
  --fg:#FBFAF7; --fg-2:#A9A79A; --fg-3:#8A8578;
  --navy:#16221D; --navy-2:#1F2C25; --on-navy:#FBFAF7; --on-navy-2:#A6C2B2; --on-navy-3:#8AA897;
  --orange:#E0B458; --on-orange:#201706; --orange-ink:#F0CE8C; --orange-wash:#33280F; --orange-line:#4A3C1E;
  --par-wash:#16332A; --par-ink:#A7D4BE; --par-dot:#5FA886;
  --fdt-wash:#33280F; --fdt-ink:#F0CE8C; --fdt-dot:#E0B458;
  --doc-wash:#331F27; --doc-ink:#F0B9C9; --doc-dot:#D1819A;
  --pares-wash:#132D3D; --pares-ink:#A9D4EE; --pares-dot:#5FA8D4;
  --danger:#FF9A92; --band:#16221D;
  --verde:#5FA886; --verde-ink:#8FD4B2; --verde-btn:#5FA886; --on-verde:#0A1A13;
  --heat-rgb:111,184,148; --heat-hi:#121714; --heat-lo:#FBFAF7;
  --logo-bg:#FBFAF7; --logo-pad:16px 20px;
  --ok-dot:#6FC694; --ok-wash:#12301F; --ok-ink:#A8E6C2;
  --err-dot:#E0B458; --err-wash:#33280F; --err-ink:#F0CE8C;
  --av-dot:#5FA8D4; --av-wash:#132D3D; --av-ink:#A9D4EE;
  --no-dot:#A9A79A; --no-wash:#242D26; --no-ink:#CFCCC1;
  color-scheme:dark;
}
body{ background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--band); }
body[data-vista="inicio"]::before, body[data-vista="curso"]::before{ background:var(--bg); }
*{ box-sizing:border-box; }
h1,h2,h3{ font-family:var(--display); font-weight:700; letter-spacing:-0.012em; text-wrap:balance; margin:0; }
button,input,textarea,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; }
.num{ font-variant-numeric:tabular-nums; }
.gut{ padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.eyebrow{ font-family:var(--body); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- cabecera ---------- */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--navy); color:var(--on-navy); }
.topbar .gut{ padding-block:13px 15px; display:flex; flex-direction:column; gap:12px; }
.toprow{ display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:0; }
.curso-pick{ display:flex; align-items:baseline; gap:8px; min-width:0; background:none; border:0; padding:0; color:var(--on-navy); text-align:left; }
.curso-pick b{ font-family:var(--display); font-size:21px; font-weight:800; letter-spacing:-0.015em; }
.curso-pick span{ font-size:12.5px; color:var(--on-navy-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.icon-btn{ display:flex; align-items:center; justify-content:center; width:40px; height:40px; flex:none; border:0; border-radius:999px; background:var(--navy-2); color:var(--on-navy); }
.fase-box{ display:flex; align-items:center; gap:10px; background:var(--navy-2); border-radius:var(--r); padding:8px 8px 8px 13px; }
.fase-now{ flex:1; min-width:0; }
.fase-now .eyebrow{ color:var(--on-navy-3); }
.fase-btn{ display:flex; align-items:center; gap:6px; margin-top:1px; padding:0; border:0; background:none; color:var(--on-navy); font-family:var(--display); font-size:16px; font-weight:700; letter-spacing:-0.01em; text-align:left; }
.next-btn{ display:flex; align-items:center; gap:5px; min-height:42px; padding:0 14px; flex:none; border:0; border-radius:var(--r-sm); background:var(--orange); color:var(--on-orange); font-weight:700; font-size:13.5px; }
.grupal{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.grupal span{ font-size:13.5px; color:var(--on-navy-2); }
.sw{ width:54px; min-height:32px; padding:3px; flex:none; border:0; border-radius:999px; background:var(--navy-2); display:flex; align-items:center; justify-content:flex-start; transition:background .15s; }
.sw[aria-checked="true"]{ background:var(--orange); justify-content:flex-end; }
.sw i{ display:block; width:26px; height:26px; border-radius:999px; background:#FFFFFF; }

/* ---------- prioridad ---------- */
.prio{ background:var(--orange-wash); border-bottom:1px solid var(--orange-line); }
.prio .gut{ padding-block:12px 13px; }
.prio-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px; }
.prio-head .eyebrow{ color:var(--orange-ink); }
.prio-head small{ font-size:11px; color:var(--orange-ink); opacity:.85; }
.prio-list{ display:flex; flex-wrap:wrap; gap:6px; }
.prio-chip{ display:flex; align-items:center; min-height:36px; padding:0 12px; border-radius:999px; background:var(--surface); border:1.5px solid var(--orange); color:var(--fg); font-size:13px; font-weight:600; }

/* ---------- grilla ---------- */
main{ display:block; }
.grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; padding-block:13px; }
@media (max-width:330px){ .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.tile{ position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:6px; min-height:60px; padding:8px 7px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line); color:var(--fg); text-align:left; }
.tile .badge{ position:absolute; top:5px; right:5px; width:18px; height:18px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; line-height:1; }
.cta-band{ background:var(--av-wash); border-bottom:1px solid var(--line); }
.cta-band .gut{ padding-block:11px 12px; display:flex; align-items:center; gap:12px; }
.cta-band > .gut > div{ flex:1; min-width:0; }
.cta-band b{ display:block; font-size:13.5px; color:var(--av-ink); }
.cta-band small{ font-size:11.5px; color:var(--fg-2); line-height:1.35; }
.pinceles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
.pincel{ display:flex; align-items:center; gap:8px; min-height:54px; padding:8px 10px; border:2px solid transparent; border-radius:12px; text-align:left; font-size:12px; font-weight:650; line-height:1.25; }
.pincel[aria-pressed="true"]{ border-color:currentColor; }
.pincel .g{ width:24px; height:24px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:999px; font-size:12.5px; font-weight:800; }

/* ---------- mapa de la sala ---------- */
.pizarra{ display:flex; align-items:center; justify-content:center; min-height:30px; margin-top:10px; border-radius:8px; background:var(--surface-2); color:var(--fg-2); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.sala-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
.sala-grid{ display:grid; gap:7px; }
.seat{ position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:5px; min-height:58px; padding:7px 6px; border-radius:12px; background:var(--surface); border:1px solid var(--line); color:var(--fg); text-align:left; }
.seat.is-prio{ border:1.5px solid var(--orange); }
.seat b{ font-size:11px; font-weight:600; line-height:1.2; }
.seat .pos{ font-size:9.5px; color:var(--fg-3); font-variant-numeric:tabular-nums; }
.seat.vacio{ background:transparent; border:1px dashed var(--line); }
.seat.vacio span{ font-size:10px; color:var(--fg-3); }
.seat .badge{ position:absolute; top:4px; right:4px; width:17px; height:17px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; }
.toggle-vista{ display:flex; gap:3px; padding:3px; border-radius:11px; background:var(--navy-2); flex:none; }
.toggle-vista button{ min-height:34px; padding:0 12px; border:0; border-radius:8px; background:transparent; color:var(--on-navy-2); font-size:12.5px; font-weight:650; }
.toggle-vista button[aria-pressed="true"]{ background:var(--surface); color:var(--fg); }
.heat{ display:flex; align-items:center; justify-content:center; min-height:46px; border-radius:9px; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
.heat.vacio{ border:1px dashed var(--line); }
.leyenda{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:11px; color:var(--fg-2); }
.leyenda .esc{ display:flex; flex:1; height:9px; border-radius:5px; overflow:hidden; }
.leyenda .esc i{ flex:1; }
.zonas{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:12px; }
.zona{ border-radius:11px; padding:9px 10px; background:var(--surface-2); }
.zona b{ display:block; font-family:var(--display); font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
.zona small{ display:block; font-size:10.5px; line-height:1.3; color:var(--fg-2); margin-top:1px; }
.tile.is-prio{ border:1.5px solid var(--orange); }
.tile b{ font-size:11.5px; font-weight:600; line-height:1.25; }
.dots{ display:flex; gap:3px; align-items:center; min-height:6px; }
.dots i{ width:6px; height:6px; border-radius:999px; display:block; }
.dots u{ font-size:9.5px; text-decoration:none; color:var(--fg-3); font-variant-numeric:tabular-nums; }

/* ---------- barra inferior ---------- */
.footbar{ position:sticky; bottom:0; z-index:15; background:var(--surface); border-top:1px solid var(--line); }
.footbar .gut{ padding-block:11px; padding-bottom:calc(11px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:12px; }
.footbar .meta{ flex:1; min-width:0; }
.footbar .meta small{ display:block; font-size:11.5px; color:var(--fg-2); }
.footbar .meta b{ font-size:15px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:46px; padding:0 18px; border:0; border-radius:var(--r); background:var(--navy); color:var(--on-navy); font-weight:650; font-size:14px; }
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn{ }
.btn.ghost{ background:var(--surface); border:1.5px solid var(--line); color:var(--fg); }
.btn.accent{ background:var(--orange); color:var(--on-orange); }
.btn.sm{ min-height:38px; padding:0 13px; font-size:13px; border-radius:var(--r-sm); }
.btn[disabled]{ opacity:.5; }
.btn.wide{ width:100%; }

/* ---------- hoja de acciones ---------- */
.sheet-bg{ position:fixed; inset:0; z-index:40; background:rgba(10,20,38,.55); }
.sheet{ position:fixed; left:0; right:0; bottom:0; top:max(24px,env(safe-area-inset-top,0px)); z-index:41; display:flex; flex-direction:column; background:var(--bg); border-radius:20px 20px 0 0; overflow:hidden; }
.sheet-head{ background:var(--surface); border-bottom:1px solid var(--line); }
.sheet-head .gut{ padding-block:13px 14px; display:flex; flex-direction:column; gap:10px; }
.sheet-title{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.sheet-title h2{ font-size:20px; font-weight:800; }
.sheet-title small{ display:block; font-size:12px; color:var(--fg-2); margin-top:2px; }
.note{ display:flex; align-items:flex-start; gap:7px; padding:8px 11px; border-radius:var(--r-sm); background:var(--orange-wash); font-size:11.5px; line-height:1.4; color:var(--orange-ink); }
.note i{ width:7px; height:7px; border-radius:999px; background:var(--orange); flex:none; margin-top:5px; }
.sheet-body{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.sheet-body .gut{ padding-block:13px; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:13px; }
.fam{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:13px 13px 14px; }
.fam-head{ display:flex; align-items:center; gap:8px; }
.fam-head i{ width:9px; height:9px; border-radius:999px; flex:none; }
.fam-head h3{ font-size:14.5px; }
.fam p{ margin:3px 0 10px 17px; font-size:11.5px; line-height:1.45; color:var(--fg-2); }
.acts{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.act{ display:flex; align-items:center; gap:6px; min-height:54px; padding:9px 11px; text-align:left; border:0; border-radius:12px; font-size:12.5px; font-weight:600; line-height:1.3; min-width:0; }
.act svg{ flex:none; }
.act .hoy{ margin-left:auto; font-size:10.5px; font-weight:700; opacity:.7; font-variant-numeric:tabular-nums; }

/* ---------- modal ---------- */
.modal-bg{ position:fixed; inset:0; z-index:50; background:rgba(10,20,38,.55); display:flex; align-items:flex-end; }
.modal{ width:100%; max-height:84vh; overflow-y:auto; background:var(--surface); border-radius:20px 20px 0 0; }
.modal .gut{ padding-block:16px; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px; }
.modal h3{ font-size:17px; }
.opt{ display:flex; align-items:center; gap:10px; width:100%; min-height:50px; padding:0 14px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); font-size:14px; font-weight:600; text-align:left; }
.opt[aria-current="true"]{ border-color:var(--orange); border-width:1.5px; }
.opt .n{ font-family:var(--display); font-size:12px; font-weight:800; color:var(--fg-3); flex:none; width:16px; }

/* ---------- secciones de pantalla completa ---------- */
.page .gut{ padding-block:14px; padding-bottom:calc(28px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 13px 15px; }
.card.warn{ background:var(--orange-wash); border-color:var(--orange-line); }
.card h3{ font-size:14.5px; margin-bottom:3px; }
.card .sub{ font-size:11.5px; color:var(--fg-2); margin-bottom:10px; }
.card.warn h3{ color:var(--orange-ink); }
.pend{ background:var(--surface); border:1px solid var(--orange-line); border-radius:12px; padding:10px 11px 11px; }
.pend label{ display:block; font-size:12px; font-weight:650; margin-bottom:7px; }
input[type=text],input[type=number],textarea{ width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 11px; font-size:13.5px; }
textarea{ min-height:110px; resize:vertical; line-height:1.45; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
.stats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.stat{ border-radius:12px; padding:10px 11px 11px; }
.stat b{ display:block; font-family:var(--display); font-size:21px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; }
.stat small{ display:block; font-size:11px; line-height:1.3; margin-top:2px; }
.row{ display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px solid var(--line); }
.row:first-of-type{ border-top:0; }
.row i{ width:7px; height:7px; border-radius:999px; background:var(--orange); flex:none; }
.row b{ font-size:13px; flex:none; }
.row small{ font-size:11.5px; color:var(--fg-2); line-height:1.3; }
.btn-row{ display:flex; flex-wrap:wrap; gap:8px; }
.list-item{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.list-item:first-child{ border-top:0; }
.list-item .grow{ flex:1; min-width:0; }
.list-item small{ display:block; font-size:11.5px; color:var(--fg-2); }
.link{ background:none; border:0; padding:4px 2px; color:var(--orange-ink); font-size:12.5px; font-weight:650; text-decoration:underline; text-underline-offset:2px; }
.link.danger{ color:var(--danger); }
.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:12px; font-weight:650; color:var(--fg-2); }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
.toggle-row:first-of-type{ border-top:0; }
.toggle-row div{ flex:1; min-width:0; }
.toggle-row b{ font-size:13.5px; }
.toggle-row small{ display:block; font-size:11.5px; color:var(--fg-2); }
.sw2{ width:54px; min-height:32px; padding:3px; flex:none; border:1px solid var(--line); border-radius:999px; background:var(--surface-2); display:flex; align-items:center; justify-content:flex-start; }
.sw2[aria-checked="true"]{ background:var(--orange); border-color:var(--orange); justify-content:flex-end; }
.sw2 i{ display:block; width:24px; height:24px; border-radius:999px; background:#FFFFFF; }

/* ---------- vista curso (proyector) ---------- */
.proj{ min-height:100%; background:var(--bg); }
.proj .gut{ padding-block:26px 30px; display:flex; flex-direction:column; gap:20px; max-width:1280px; margin:0 auto; }
.proj-head{ display:flex; align-items:baseline; justify-content:space-between; gap:18px; flex-wrap:wrap; border-bottom:3px solid var(--navy); padding-bottom:13px; }
:root[data-theme="dark"] .proj-head, :root:not([data-theme="light"]) .proj-head{ border-bottom-color:var(--par-dot); }
.proj-head h1{ font-size:clamp(24px,4.4vw,34px); font-weight:800; }
.proj-head span{ font-size:clamp(14px,2.1vw,19px); color:var(--fg-2); }
.meta-card{ background:var(--navy); color:var(--on-navy); border-radius:var(--r-lg); padding:22px 26px 24px; display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
:root[data-theme="dark"] .meta-card, :root:not([data-theme="light"]) .meta-card{ background:var(--navy-2); }
.meta-num{ flex:none; }
.meta-num .eyebrow{ color:var(--on-navy-2); }
.meta-num div{ display:flex; align-items:baseline; gap:10px; margin-top:3px; }
.meta-num b{ font-family:var(--display); font-size:clamp(42px,8vw,62px); font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.meta-num span{ font-size:clamp(17px,3vw,25px); font-weight:600; color:var(--on-navy-2); }
.meta-bar{ flex:1; min-width:220px; }
.bar{ height:28px; border-radius:999px; background:var(--navy-2); overflow:hidden; }
:root[data-theme="dark"] .bar, :root:not([data-theme="light"]) .bar{ background:#0D1520; }
.bar i{ display:block; height:100%; border-radius:999px; background:var(--orange); }
.meta-bar p{ margin:11px 0 0; font-size:clamp(14px,2.1vw,18px); }
.proj-cols{ display:flex; gap:18px; flex-wrap:wrap; }
.star-card{ flex:1 1 360px; min-width:0; background:var(--surface); border:2px solid var(--orange); border-radius:var(--r-lg); padding:22px 24px; display:flex; flex-direction:column; gap:11px; }
.star-card .eyebrow{ color:var(--orange-ink); }
.star-card b{ font-family:var(--display); font-size:clamp(30px,5.4vw,42px); font-weight:800; line-height:1.05; letter-spacing:-0.025em; }
.star-card p{ margin:0; font-size:clamp(14px,2.1vw,18px); line-height:1.45; color:var(--fg-2); }
.premios{ flex:1 1 380px; min-width:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; align-content:start; }
@media (max-width:620px){ .premios{ grid-template-columns:1fr; } }
.premio{ border-radius:16px; padding:17px 19px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.premio span{ display:flex; align-items:center; gap:7px; font-size:clamp(12px,1.7vw,15px); font-weight:650; line-height:1.25; }
.premio b{ font-family:var(--display); font-size:clamp(20px,3.4vw,29px); font-weight:800; letter-spacing:-0.02em; line-height:1.1; }
.proj-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px; color:var(--fg-2); }

/* ---------- toast ---------- */
.toast{ position:fixed; left:max(12px,env(safe-area-inset-left,0px)); right:max(12px,env(safe-area-inset-right,0px)); bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:60; display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r); background:var(--fg); color:var(--bg); font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.22); }
.toast .grow{ flex:1; min-width:0; }
.toast button{ flex:none; border:0; border-radius:var(--r-sm); background:var(--orange); color:var(--on-orange); font-weight:700; font-size:12.5px; min-height:36px; padding:0 13px; }
@media (prefers-reduced-motion:no-preference){ .toast{ animation:rise .18s ease-out; } @keyframes rise{ from{ transform:translateY(10px); opacity:0 } } }

.btn.verde{ background:var(--verde-btn); color:var(--on-verde); }

/* ---------- consolidado ---------- */
.seg{ display:flex; gap:3px; padding:3px; border-radius:12px; background:var(--surface-2); }
.seg button{ flex:1; min-height:42px; border:0; border-radius:9px; background:transparent; color:var(--fg-2); font-size:13px; font-weight:600; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--fg); font-weight:700; box-shadow:0 1px 3px rgba(16,30,54,.14); }
.aviso{ display:flex; gap:9px; align-items:flex-start; padding:11px 12px; border-radius:12px; background:var(--surface-2); font-size:11.5px; line-height:1.45; color:var(--fg-2); }
.aviso b{ color:var(--fg); }
.bar-row{ display:flex; flex-direction:column; gap:4px; padding:8px 0; border-top:1px solid var(--line); }
.bar-row:first-child{ border-top:0; padding-top:2px; }
.bar-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.bar-n{ font-size:13px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-v{ font-size:13.5px; font-weight:700; flex:none; font-variant-numeric:tabular-nums; }
.bar-track{ height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
.bar-track i{ display:block; height:100%; border-radius:4px; }
.bar-d{ font-size:11px; color:var(--fg-2); }
.vacio{ margin:0; padding:12px 2px; font-size:12.5px; color:var(--fg-2); }
.meter{ height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden; margin-top:8px; }
.meter i{ display:block; height:100%; border-radius:5px; }
.dato{ margin:9px 0 0; font-size:12px; line-height:1.5; color:var(--fg-2); }
.dato b{ color:var(--fg); font-variant-numeric:tabular-nums; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.chip-n{ display:inline-flex; align-items:center; min-height:32px; padding:0 11px; border-radius:999px; background:var(--surface-2); font-size:12.5px; font-weight:600; }
.rie-al{ padding:11px 0; border-top:1px solid var(--line); }
.rie-al:first-of-type{ border-top:0; padding-top:2px; }
.rie-al > b{ font-size:13.5px; }
.rie-it{ display:flex; gap:9px; margin-top:7px; }
.rie-it .c{ flex:none; min-width:24px; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
.rie-it > div{ min-width:0; }
.rie-it .a{ font-size:12.5px; font-weight:600; line-height:1.3; }
.rie-it .r{ font-size:11px; line-height:1.45; color:var(--fg-2); margin-top:2px; }
.rie-it .r b{ color:var(--fg); }
.alerta{ display:flex; gap:9px; align-items:flex-start; padding:11px 12px; border-radius:12px; font-size:11.5px; line-height:1.45; margin-top:10px; background:var(--fdt-wash); color:var(--fdt-ink); }
.alerta.ok{ background:var(--pares-wash); color:var(--pares-ink); }
.alerta svg{ flex:none; margin-top:1px; }

/* ---------- editor de nómina ---------- */
.file-label{ position:relative; overflow:hidden; }
.file-label input[type=file]{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
.nomina{ display:flex; flex-direction:column; gap:6px; max-height:252px; overflow-y:auto; margin-top:9px; padding:9px; border:1px solid var(--line); border-radius:12px; background:var(--bg); }
.nom-row{ display:flex; align-items:center; gap:7px; }
.nom-row .n{ width:22px; flex:none; text-align:right; font-size:11px; color:var(--fg-3); font-variant-numeric:tabular-nums; }
.nom-row input{ flex:1; min-width:0; padding:7px 9px; font-size:13px; }
.nom-del{ width:36px; height:36px; flex:none; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--fg-2); }
.nomina-vacia{ margin:0; padding:14px 4px; text-align:center; font-size:12.5px; color:var(--fg-2); }

/* ---------- pantalla de inicio ---------- */
.inicio{ min-height:72vh; display:flex; flex-direction:column; justify-content:center; }
.inicio .gut{ padding-block:30px 34px; display:flex; flex-direction:column; align-items:center; gap:19px; text-align:center; }
.logo-card{ width:min(250px,68vw); display:flex; align-items:center; justify-content:center; padding:var(--logo-pad); border-radius:22px; background:var(--logo-bg); transform:translateX(var(--logo-shift)); }
.logo-card img{ width:100%; height:auto; display:block; }
.inicio .eyebrow{ color:var(--verde-ink); display:block; margin-bottom:5px; }
.inicio h1{ font-size:clamp(24px,6.6vw,33px); font-weight:800; line-height:1.12; max-width:11em; }
.marca{ display:flex; flex-direction:column; align-items:center; gap:13px; }
.regla{ display:block; width:min(150px,45vw); height:1px; background:var(--orange); }
.inicio .wordmark{ margin:0; font-family:var(--body); font-size:clamp(27px,7.8vw,34px); font-weight:600; letter-spacing:.2em; text-indent:.2em; line-height:1.1; color:var(--verde-ink); max-width:none; }
.bajada{ margin:0; font-size:13px; color:var(--fg-2); }
.wordmark-sm{ font-family:var(--body); font-size:21px; font-weight:600; letter-spacing:.2em; text-indent:.2em; color:var(--verde-ink); }
.inicio p{ margin:0; max-width:29em; font-size:13.5px; line-height:1.55; color:var(--fg-2); }
.acciones{ display:flex; flex-direction:column; gap:9px; width:min(330px,100%); }
.inicio-foot{ display:flex; flex-direction:column; align-items:center; gap:2px; margin-top:2px; }
.inicio-foot small{ font-size:11.5px; color:var(--fg-3); letter-spacing:.03em; }

.empty{ text-align:center; padding:28px 8px; }
.empty h2{ font-size:19px; margin-bottom:6px; }
.empty p{ margin:0 auto 16px; max-width:34em; font-size:13.5px; color:var(--fg-2); }
</style>

/* En su propio sitio puede descargar y compartir archivos; dentro de un
   visor incrustado eso está bloqueado, y ahí solo queda copiar y pegar. */
var APP_PROPIA = (function(){ try{ return window.self === window.top; }catch(e){ return false; } })();

var KEY = "registro-participacion-v1";
var DB = null;
var vista = "clase";
var sheetAlumno = null;
var modal = null;
var toastTimer = null;
var toastData = null;
var avisoRespaldo = true;
var focoPendiente = null;
var periodo = "semana";
var barrido = null;

function nuevoDB(){
  return {
    v:1, cursos:[], cursoActivo:null, registros:[], clases:[], barridos:[],
    semanas:{},
    config:{ mostrarInicio:true, vistaCurso:true, reconocimientos:true, meta:250, etiquetaPrincipal:"Matemático de la semana", etiquetas:{}, ultimoRespaldo:null }
  };
}
function cargar(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.cursos){ return normalizar(d); } }
  }catch(e){}
  return nuevoDB();
}
function normalizar(d){
  var base = nuevoDB();
  d.config = Object.assign({}, base.config, d.config || {});
  d.config.etiquetas = d.config.etiquetas || {};
  d.semanas = d.semanas || {};
  d.registros = d.registros || [];
  d.clases = d.clases || [];
  d.barridos = d.barridos || [];
  return d;
}
function guardar(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("No se pudo guardar en este navegador. Copia un respaldo desde Ajustes.", null); }
}

/* ========== utilidades ========== */
function h(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function hoyISO(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function hora(ts){ var d = new Date(ts); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function fechaLarga(iso){
  var m = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var dd = ["dom","lun","mar","mié","jue","vie","sáb"];
  var p = iso.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]);
  return dd[d.getDay()] + " " + (+p[2]) + " " + m[+p[1]-1];
}
function semanaKey(d){
  d = new Date(d); d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  var ini = new Date(d.getFullYear(), 0, 1);
  var n = Math.ceil(((d - ini) / 86400000 + 1) / 7);
  return d.getFullYear() + "-S" + String(n).padStart(2,"0");
}
function rangoSemana(base){
  var d = new Date(base); d.setHours(0,0,0,0);
  var dia = d.getDay() || 7;
  var lun = new Date(d); lun.setDate(d.getDate() - dia + 1);
  var vie = new Date(lun); vie.setDate(lun.getDate() + 4);
  var m = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  if(lun.getMonth() === vie.getMonth()) return "Semana del " + lun.getDate() + " al " + vie.getDate() + " de " + m[vie.getMonth()];
  return "Semana del " + lun.getDate() + " de " + m[lun.getMonth()] + " al " + vie.getDate() + " de " + m[vie.getMonth()];
}
function corto(nombre){
  var n = String(nombre).replace(/\s+/g," ").trim();
  if(n.indexOf(",") > -1){
    var pp = n.split(",");
    var ap = (pp[0]||"").trim().split(" ")[0] || "";
    var no = (pp[1]||"").trim().split(" ")[0] || "";
    return (no + (ap ? " " + ap.charAt(0).toUpperCase() + "." : "")).trim() || n;
  }
  var t = n.split(" ");
  if(t.length === 1) return t[0];
  return t[0] + " " + t[1].charAt(0).toUpperCase() + ".";
}

/* ========== acceso a datos ========== */
function curso(){ return DB.cursos.filter(function(c){ return c.id === DB.cursoActivo; })[0] || DB.cursos[0] || null; }
function alumnosDe(c){ return (c && c.estudiantes) || []; }
function alumno(c, id){ return alumnosDe(c).filter(function(a){ return a.id === id; })[0] || null; }
function salaDe(c){ return (c && c.sala) || null; }
function asientoDe(c, aid){
  var s = salaDe(c); if(!s) return "";
  var ks = Object.keys(s.asientos || {});
  for(var i = 0; i < ks.length; i++){ if(s.asientos[ks[i]] === aid) return ks[i]; }
  return "";
}
function sinPuesto(c){
  var s = salaDe(c); if(!s) return alumnosDe(c);
  var ocupados = {};
  Object.keys(s.asientos || {}).forEach(function(k){ ocupados[s.asientos[k]] = true; });
  return alumnosDe(c).filter(function(a){ return !ocupados[a.id]; });
}
function clasesDe(cid){ return DB.clases.filter(function(x){ return x.cursoId === cid; }).sort(function(a,b){ return b.ts - a.ts; }); }
function claseAbierta(cid){ return DB.clases.filter(function(x){ return x.cursoId === cid && !x.cerrada; }).sort(function(a,b){ return b.ts - a.ts; })[0] || null; }
function asegurarClase(){
  var c = curso(); if(!c) return null;
  var cl = claseAbierta(c.id);
  if(cl) return cl;
  cl = { id:uid(), cursoId:c.id, fecha:hoyISO(), ts:Date.now(), cerrada:false, fase:FASES[0].id, grupal:false };
  DB.clases.push(cl); guardar();
  return cl;
}
function regsDeClase(clId){ return DB.registros.filter(function(r){ return r.claseId === clId; }); }

/* ========== prioridad viva ========== */
function prioridad(c, cl){
  if(!c) return [];
  var lista = clasesDe(c.id).slice(0, VENTANA);
  if(cl && lista.map(function(x){ return x.id; }).indexOf(cl.id) === -1) lista.unshift(cl);
  var idx = {}; lista.forEach(function(x,i){ idx[x.id] = i; });
  var ultLlam = {}, ultVol = {}, totalPar = {};
  DB.registros.forEach(function(r){
    if(!(r.claseId in idx)) return;
    var a = ACC_BY_ID[r.accionId]; if(!a || a.f !== "par") return;
    var i = idx[r.claseId];
    totalPar[r.alumnoId] = (totalPar[r.alumnoId] || 0) + 1;
    if(a.k === "llamada" && (ultLlam[r.alumnoId] === undefined || i < ultLlam[r.alumnoId])) ultLlam[r.alumnoId] = i;
    if(a.k === "voluntaria" && (ultVol[r.alumnoId] === undefined || i < ultVol[r.alumnoId])) ultVol[r.alumnoId] = i;
  });
  var arr = alumnosDe(c).map(function(a){
    var l = ultLlam[a.id] === undefined ? VENTANA : ultLlam[a.id];
    var v = ultVol[a.id] === undefined ? VENTANA : ultVol[a.id];
    return { id:a.id, nombre:a.nombre, score:l + v, llam:l, vol:v, tot:totalPar[a.id] || 0 };
  });
  arr.sort(function(x,y){ return (y.score - x.score) || (x.tot - y.tot) || x.nombre.localeCompare(y.nombre,"es"); });
  var n = Math.max(1, Math.round(alumnosDe(c).length * 0.10));
  return arr.slice(0, n);
}
function razon(p){
  if(p.llam >= VENTANA && p.vol >= VENTANA) return "sin registros de participación";
  if(p.llam >= p.vol) return p.llam >= VENTANA ? "no lo llamas en la ventana" : "no lo llamas hace " + p.llam + (p.llam === 1 ? " clase" : " clases");
  return p.vol >= VENTANA ? "sin participación voluntaria" : "sin participar hace " + p.vol + (p.vol === 1 ? " clase" : " clases");
}

/* ========== registrar ========== */
function registrar(alumnoId, accionId){
  var c = curso(); var cl = asegurarClase(); if(!c || !cl) return;
  var a = ACC_BY_ID[accionId];
  var r = { id:uid(), cursoId:c.id, claseId:cl.id, alumnoId:alumnoId, accionId:accionId,
            fase:cl.fase, grupal:!!cl.grupal, asiento:asientoDe(c, alumnoId), ts:Date.now(), nota:"" };
  DB.registros.push(r); guardar();
  sheetAlumno = null;
  var nom = corto((alumno(c, alumnoId) || {}).nombre || "");
  toast(nom + " · " + a.t + (a.otro ? " · lo describes al cerrar" : ""), r.id);
  render();
}
function deshacer(id){
  DB.registros = DB.registros.filter(function(r){ return r.id !== id; });
  guardar(); cerrarToast(); render();
}

/* ========== toast ========== */
function toast(texto, regId){
  toastData = { texto:texto, regId:regId };
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastData = null; render(); }, 6000);
}
function cerrarToast(){ toastData = null; if(toastTimer) clearTimeout(toastTimer); }

/* ========== semana y reconocimientos ========== */
function regsSemana(cid, offsetSemanas){
  var base = new Date(); base.setDate(base.getDate() - 7 * (offsetSemanas || 0));
  var k = semanaKey(base);
  return DB.registros.filter(function(r){ return r.cursoId === cid && semanaKey(new Date(r.ts)) === k; });
}
function conteoPositivo(regs){
  var m = {};
  regs.forEach(function(r){ var a = ACC_BY_ID[r.accionId]; if(a && a.f === "par" && a.s > 0) m[r.alumnoId] = (m[r.alumnoId]||0)+1; });
  return m;
}
function top(mapa, n){
  return Object.keys(mapa).filter(function(k){ return mapa[k] > 0; })
    .sort(function(a,b){ return mapa[b] - mapa[a]; }).slice(0, n || 3);
}
function candidatos(c){
  var esta = regsSemana(c.id, 0), previa = regsSemana(c.id, 1);
  var cE = conteoPositivo(esta), cP = conteoPositivo(previa);
  var mejora = {}; alumnosDe(c).forEach(function(a){
    var d = (cE[a.id]||0) - (cP[a.id]||0); if(d > 0) mejora[a.id] = d;
  });
  var crec = {}, expl = {};
  esta.forEach(function(r){
    var a = ACC_BY_ID[r.accionId]; if(!a) return;
    if(a.mc) crec[r.alumnoId] = (crec[r.alumnoId]||0)+1;
    if(a.explica) expl[r.alumnoId] = (expl[r.alumnoId]||0)+1;
  });
  var primeraVezAntes = {};
  DB.registros.forEach(function(r){
    if(r.cursoId !== c.id) return;
    var a = ACC_BY_ID[r.accionId]; if(!a || a.k !== "voluntaria") return;
    if(semanaKey(new Date(r.ts)) !== semanaKey(new Date())) primeraVezAntes[r.alumnoId] = true;
  });
  var primera = {};
  esta.forEach(function(r){
    var a = ACC_BY_ID[r.accionId]; if(!a || a.k !== "voluntaria") return;
    if(!primeraVezAntes[r.alumnoId]) primera[r.alumnoId] = (primera[r.alumnoId]||0)+1;
  });
  var principal = {};
  esta.forEach(function(r){
    var a = ACC_BY_ID[r.accionId]; if(!a || a.f === "doc") return;
    if(a.s > 0) principal[r.alumnoId] = (principal[r.alumnoId]||0) + 1;
  });
  return { mejora:top(mejora), primera:top(primera), crecimiento:top(crec), explica:top(expl), principal:top(principal) };
}
function premioGuardado(c, key){
  var s = DB.semanas[c.id + "|" + semanaKey(new Date())];
  return s ? s[key] : null;
}
function fijarPremio(c, key, alumnoId){
  var k = c.id + "|" + semanaKey(new Date());
  DB.semanas[k] = DB.semanas[k] || {};
  if(alumnoId) DB.semanas[k][key] = alumnoId; else delete DB.semanas[k][key];
  guardar(); render();
}
function etiqueta(id, def){ return (DB.config.etiquetas && DB.config.etiquetas[id]) || def; }

/* ========== exportación ========== */
function csv(){
  var filas = [["tipo_registro","curso","fecha","hora","fase","estudiante","familia","accion","tipo_participacion","tipo_fuera_tarea","trabajo_grupal","signo","nota"]];
  function nombreFase(id){ var f = FASES.filter(function(x){ return x.id === id; })[0]; return f ? f.t : ""; }
  DB.registros.slice().sort(function(a,b){ return a.ts - b.ts; }).forEach(function(r){
    var c = DB.cursos.filter(function(x){ return x.id === r.cursoId; })[0];
    var al = c ? alumno(c, r.alumnoId) : null;
    var cl = DB.clases.filter(function(x){ return x.id === r.claseId; })[0];
    var a = ACC_BY_ID[r.accionId]; if(!a) return;
    filas.push([ "interaccion", c?c.nombre:"", cl?cl.fecha:"", hora(r.ts), nombreFase(r.fase), al?al.nombre:"",
      FAM_BY_ID[a.f].t, a.t, a.k||"", a.boss||"", r.grupal?"sí":"no", a.s>0?"+":(a.s<0?"-":"0"), r.nota||"" ]);
  });
  DB.barridos.slice().sort(function(a,b){ return a.ts - b.ts; }).forEach(function(b){
    var c = DB.cursos.filter(function(x){ return x.id === b.cursoId; })[0];
    var cl = DB.clases.filter(function(x){ return x.id === b.claseId; })[0];
    Object.keys(b.marcas || {}).forEach(function(aid){
      var al = c ? alumno(c, aid) : null;
      var e = BAR_BY_ID[b.marcas[aid]]; if(!e) return;
      filas.push([ "barrido", c?c.nombre:"", cl?cl.fecha:"", hora(b.ts), nombreFase(b.fase), al?al.nombre:"",
        "Práctica autónoma", e.t, "", "", "", e.id === "ok" ? "+" : (e.id === "no" ? "-" : "0"), "" ]);
    });
  });
  return filas.map(function(f){
    return f.map(function(v){ v = String(v==null?"":v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(";");
  }).join("\n");
}
function nombreArchivo(ext){ return "turnos-" + (curso() ? curso().nombre.replace(/[^\wÁÉÍÓÚÑáéíóúñ°]+/g,"-") + "-" : "") + hoyISO() + "." + ext; }
function descargar(nombre, texto, tipo){
  try{
    var b = new Blob([texto], { type: tipo });
    var u = URL.createObjectURL(b);
    var a = document.createElement("a");
    a.href = u; a.download = nombre; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(u); a.remove(); }catch(e){} }, 2000);
    toast("Descargado: " + nombre, null); render();
  }catch(e){ toast("No se pudo descargar. Usa copiar y pegar.", null); render(); }
}
function compartir(nombre, texto, tipo){
  try{
    if(navigator.canShare && typeof File === "function"){
      var f = new File([texto], nombre, { type: tipo });
      if(navigator.canShare({ files:[f] })){
        navigator.share({ files:[f], title:nombre }).catch(function(){});
        return;
      }
    }
    if(navigator.share){ navigator.share({ title:nombre, text:texto }).catch(function(){}); return; }
    copiar(texto, "bak");
  }catch(e){ copiar(texto, "bak"); }
}
function copiar(texto, ok){
  function fallback(){
    var el = document.getElementById(ok === "csv" ? "out-csv" : "out-bak");
    if(el){ el.focus(); el.select(); }
    toast("No se pudo copiar solo. El texto quedó seleccionado: cópialo a mano.", null); render();
  }
  try{
    navigator.clipboard.writeText(texto).then(function(){ toast("Copiado. Pégalo donde lo necesites.", null); render(); }, fallback);
  }catch(e){ fallback(); }
}

/* ========== render ========== */
function render(){
  var app = document.getElementById("app");
  var c = curso();
  var html = "";
  if(!c && vista !== "config" && vista !== "inicio" && vista !== "quienes"){ vista = "config"; }
  document.body.setAttribute("data-vista", vista);
  if(vista === "inicio")      html = vistaInicio(c);
  else if(vista === "clase" && barrido) html = vistaBarrido(c);
  else if(vista === "clase")  html = vistaClase(c);
  else if(vista === "cierre") html = vistaCierre(c);
  else if(vista === "consolidado") html = vistaConsolidado(c);
  else if(vista === "sala")   html = vistaSala(c);
  else if(vista === "quienes") html = vistaQuienes();
  else if(vista === "curso")  html = vistaCurso(c);
  else                        html = vistaConfig(c);
  if(sheetAlumno && vista === "clase") html += hojaAcciones(c, sheetAlumno);
  if(modal) html += modalHTML(c);
  if(toastData) html += '<div class="toast" role="status"><span class="grow">' + h(toastData.texto) + '</span>' +
    (toastData.regId ? '<button type="button" data-act="deshacer" data-id="' + toastData.regId + '">Deshacer</button>' : '') + '</div>';
  app.innerHTML = html;
  if(focoPendiente){
    var f = document.getElementById(focoPendiente);
    focoPendiente = null;
    if(f){ try{ f.focus(); }catch(e){} }
  }
}

function estrellaSVG(size, color){

}

/* ---- vista clase ---- */
function vistaClase(c){
  var cl = asegurarClase();
  var fase = FASES.filter(function(f){ return f.id === cl.fase; })[0] || FASES[0];
  var faseIdx = FASES.indexOf(fase);
  var ultima = faseIdx === FASES.length - 1;
  var regs = regsDeClase(cl.id);
  var prio = prioridad(c, cl);
  var prioIds = {}; prio.forEach(function(p){ prioIds[p.id] = true; });

  var porAlumno = {};
  regs.forEach(function(r){
    var a = ACC_BY_ID[r.accionId]; if(!a) return;
    (porAlumno[r.alumnoId] = porAlumno[r.alumnoId] || []).push(a.f);
  });
  var sinNada = alumnosDe(c).filter(function(a){ return !porAlumno[a.id]; }).length;

  var s = "";
  s += '<header class="topbar"><div class="gut">';
  s += '<div class="toprow"><button type="button" class="curso-pick" data-act="modal" data-m="curso">' +
        '<b>' + h(c.nombre) + '</b><span>' + h(c.asignatura || "") + (c.asignatura ? " · " : "") + fechaLarga(cl.fecha) + '</span></button>' +
        '<div style="display:flex;gap:7px;flex:none">' +
        (DB.config.vistaCurso ? '<button type="button" class="icon-btn" data-act="ir" data-v="curso" aria-label="Vista para el curso">' + estrellaSVG(17,"currentColor") + '</button>' : '') +
        '<button type="button" class="icon-btn" data-act="ir" data-v="config" aria-label="Ajustes">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>' +
        '</div></div>';
  s += '<div class="fase-box"><div class="fase-now"><div class="eyebrow">Fase ' + (faseIdx+1) + ' de ' + FASES.length + '</div>' +
       '<button type="button" class="fase-btn" data-act="modal" data-m="fase">' + h(fase.t) +
       '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 6l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>';
  s += ultima
    ? '<button type="button" class="next-btn" data-act="ir" data-v="cierre">Cerrar clase</button>'
    : '<button type="button" class="next-btn" data-act="fase-next">Siguiente<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
  s += '</div>';
  s += '<div class="grupal"><span>Trabajo grupal</span><button type="button" class="sw" role="switch" aria-checked="' + (cl.grupal?"true":"false") + '" aria-label="Trabajo grupal" data-act="grupal"><i></i></button></div>';
  s += '</div></header>';

  if(prio.length){
    s += '<section class="prio" aria-label="Prioridad de participación"><div class="gut">' +
      '<div class="prio-head"><span class="eyebrow">Pregúntale a</span><small>se actualiza solo</small></div><div class="prio-list">';
    prio.forEach(function(p){ s += '<button type="button" class="prio-chip" data-act="abrir" data-id="' + p.id + '">' + h(corto(p.nombre)) + '</button>'; });
    s += '</div></div></section>';
  }

  if(FASES_BARRIDO[cl.fase]){
    var hechos = DB.barridos.filter(function(b){ return b.claseId === cl.id; }).length;
    s += '<section class="cta-band"><div class="gut"><div>' +
      '<b>Barrido de práctica</b><small>' + (hechos ? hechos + (hechos === 1 ? " barrido hecho en esta clase" : " barridos hechos en esta clase") : "Mira el cuaderno de cada uno y marca en un toque") + '</small></div>' +
      '<button type="button" class="btn sm accent" data-act="barrido-ini" style="flex:none">Iniciar</button></div></section>';
  }

  var dias = DB.config.ultimoRespaldo ? Math.floor((Date.now() - DB.config.ultimoRespaldo)/86400000) : null;
  if(avisoRespaldo && DB.registros.length > 20 && (dias === null || dias >= 7)){
    s += '<div class="gut" style="padding-block:10px 0"><div class="card warn" style="display:flex;gap:10px;align-items:flex-start">' +
      '<div style="flex:1;min-width:0"><h3>Respalda tus datos</h3><div class="sub" style="margin:0">' +
      (dias === null ? "Todavía no has hecho ningún respaldo." : "Van " + dias + " días desde tu último respaldo.") +
      ' Si cambias de teléfono o borras los datos del navegador, se pierde todo.</div></div>' +
      '<button type="button" class="btn sm accent" data-act="ir" data-v="config" data-sec="respaldo">Respaldar</button>' +
      '<button type="button" class="icon-btn" style="background:transparent;width:32px;height:32px" data-act="cerrar-aviso" aria-label="Ocultar aviso">' +
      '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>' +
      '</div></div>';
  }

  function puntos(a){
    var fams = porAlumno[a.id] || [];
    var vistos = [], extra = 0;
    fams.forEach(function(f){ if(vistos.length < 3 && vistos.indexOf(f) === -1) vistos.push(f); });
    if(fams.length > vistos.length) extra = fams.length - vistos.length;
    return '<span class="dots">' + vistos.map(function(f){ return '<i style="background:var(--' + f + '-dot)"></i>'; }).join("") +
      (extra ? '<u>+' + extra + '</u>' : '') + '</span>';
  }

  var sala = salaDe(c);
  var enSala = sala && DB.config.vistaSala;
  s += '<main class="gut">';
  if(sala){
    s += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px">' +
      '<span class="eyebrow" style="color:var(--fg-2)">' + (enSala ? "Mapa de la sala" : "Lista del curso") + '</span>' +
      '<div class="toggle-vista" style="background:var(--surface-2)">' +
      '<button type="button" aria-pressed="' + (!enSala?"true":"false") + '" data-act="modo-lista" style="color:' + (!enSala?"var(--fg)":"var(--fg-2)") + '">Lista</button>' +
      '<button type="button" aria-pressed="' + (enSala?"true":"false") + '" data-act="modo-sala" style="color:' + (enSala?"var(--fg)":"var(--fg-2)") + '">Sala</button>' +
      '</div></div>';
  }

  if(enSala){
    s += '<div style="padding-top:12px"><div class="sala-scroll"><div class="sala-grid" style="grid-template-columns:repeat(' + sala.cols + ',minmax(58px,1fr))">';
    for(var fi = sala.filas - 1; fi >= 0; fi--){
      for(var ci = 0; ci < sala.cols; ci++){
        var key = fi + "-" + ci;
        var aid = (sala.asientos || {})[key];
        var al = aid ? alumno(c, aid) : null;
        if(!al){ s += '<div class="seat vacio"><span>' + (fi+1) + '·' + (ci+1) + '</span></div>'; continue; }
        s += '<button type="button" class="seat' + (prioIds[al.id] ? " is-prio" : "") + '" data-act="abrir" data-id="' + al.id + '">' +
          '<b>' + h(corto(al.nombre)) + '</b>' + puntos(al) +
          '<span class="pos" style="position:absolute;top:5px;right:6px">' + (fi+1) + '·' + (ci+1) + '</span></button>';
      }
    }
    s += '</div></div><div class="pizarra">Pizarra</div>';
    var sp = sinPuesto(c);
    if(sp.length){
      s += '<div style="margin-top:14px"><span class="eyebrow" style="color:var(--fg-2)">Sin puesto asignado</span>' +
        '<div class="grid" style="padding-top:8px">' +
        sp.map(function(a){
          return '<button type="button" class="tile' + (prioIds[a.id] ? " is-prio" : "") + '" data-act="abrir" data-id="' + a.id + '">' +
            '<b>' + h(corto(a.nombre)) + '</b>' + puntos(a) + '</button>';
        }).join("") + '</div></div>';
    }
    s += '</div>';
  } else {
    s += '<div class="grid">';
    alumnosDe(c).forEach(function(a){
      s += '<button type="button" class="tile' + (prioIds[a.id] ? " is-prio" : "") + '" data-act="abrir" data-id="' + a.id + '">' +
        '<b>' + h(corto(a.nombre)) + '</b>' + puntos(a) + '</button>';
    });
    s += '</div>';
  }
  s += '</main>';

  s += '<div class="footbar"><div class="gut"><div class="meta">' +
    '<small>Sin ningún registro hoy</small><b class="num">' + sinNada + (sinNada === 1 ? " estudiante" : " estudiantes") + '</b></div>' +
    '<span class="num" style="font-size:12px;color:var(--fg-2);flex:none">' + regs.length + ' hoy</span>' +
    '<button type="button" class="btn" data-act="ir" data-v="cierre">Cerrar clase</button></div></div>';
  return s;
}

/* ---- quiénes somos ---- */

    '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +

    '<div style="font-size:12px;color:var(--on-navy-2)">Turnos · Savia Educa</div></div>' +
    '</div></div></header>';

  s += '<div class="page"><div class="gut">';
  s += '<section class="card" style="text-align:center"><div class="logo-card" style="width:min(225px,62vw);margin:2px auto 14px">' +
    '<img src="' + LOGO + '" alt="Savia Educa"></div>' +
    '<span class="regla" style="margin:0 auto 12px"></span>' +
    '<div class="wordmark-sm">TURNOS</div>' +
    '<p class="dato" style="margin-top:7px">Registro de interacciones de aula<br>Desarrollada por Savia Educa</p></section>';

  function bloque(t, parrafos){
    return '<section class="card"><h3>' + h(t) + '</h3>' +
      parrafos.map(function(x){ return '<p class="dato" style="font-size:13px;line-height:1.6">' + x + '</p>'; }).join("") + '</section>';
  }

  s += bloque("Qué es", ["Una app web que corre en el teléfono del profesor durante la clase. Un archivo, sin servidor y sin cuenta: los datos quedan en el dispositivo de cada profesor."]);
  s += bloque("Qué problema resuelve", ["Entre lo que pasa en la clase y lo que queda registrado hay un vacío. El libro de clases guarda notas y anotaciones: el resultado y la falta. Nadie guarda quién participó, quién no, y qué hacía el que no participaba. Turnos produce ese insumo, que es previo a la nota y previo a la anotación."]);
  s += bloque("Quién la usa", ["El profesor de asignatura, solo, en su teléfono, mientras hace clases. Admite varios cursos. Cualquier profesor la carga con sus propios cursos."]);
  s += bloque("Objetivo", ["Tomar decisiones pedagógicas con evidencia en vez de impresión: a quién preguntar la próxima clase, quién termina rápido pero equivocado, en qué fase se cae la clase, y qué tan parejo reparte el profesor sus turnos."]);
  s += bloque("Cómo funciona", [
    "Registrar toma dos toques: el estudiante, luego la acción. Hay 29 acciones en cuatro familias, nombradas por la conducta concreta y agrupadas por color. Cada registro guarda la fase de la clase, si era trabajo grupal, y el puesto.",
    "Durante la clase hay una franja viva con el 10% del curso que menos ha participado, que se reordena sola cada vez que registras. En las fases de trabajo hay un barrido de la práctica autónoma, con cuatro estados y un toque por estudiante.",
    "Al cerrar la clase se completan las descripciones pendientes, aparece el resumen y queda armada la lista para la clase siguiente.",
    "El consolidado, por semana o por mes, entrega: quiénes más y menos participan, la concentración de turnos, el desglose de fuera de tarea, el mapa de calor por puesto, el resultado de los barridos, la correspondencia con el reglamento interno del establecimiento y la evidencia para sus reconocimientos. Todo exportable a Excel.",
    "Hay además una vista para proyectar al curso, con meta colectiva y reconocimientos, sin ranking ni conteos individuales."
  ]);
  s += bloque("En qué se basa", [
    "Ninguna categoría de Turnos es una ocurrencia. Cada decisión de diseño viene de una línea de investigación declarada.",
    "La distinción entre participación voluntaria y participación por llamada directa viene de Flanders y su sistema de análisis de la interacción. Las categorías de fuera de tarea y el muestreo por intervalos en vez de censo, de Shapiro y el instrumento BOSS. Tratar la interacción del profesor como objeto de medición propio, de Pianta y Hamre. Las categorías de trabajo entre pares y el indicador de ayuda aplicada, de Webb y Nelson-Le Gall, que distinguen pedir la respuesta de pedir una explicación. La decisión de no usar «trabajan juntos» como categoría, de Mercer y sus tres tipos de habla. La familia de movimientos del profesor, de Michaels, O’Connor y Resnick. El registro de solo las dimensiones observables del engagement, de Fredricks, Blumenfeld y Paris. El mapa de calor por puesto y, sobre todo, lo que ese mapa no permite concluir, de Adams y Biddle, Sommer, Koneya y Daum.",
    "El marco normativo es chileno: el Decreto 67/2018 establece que no toda evaluación conduce a calificación, lo que sostiene que estos datos no entren en la nota. La correspondencia con faltas y con reconocimientos se configura según el reglamento interno de cada establecimiento."
  ]);
  s += bloque("Límites que la plataforma declara", [
    "Registra conducta observable. No infiere engagement emocional ni cognitivo.",
    "Es muestreo, no censo. Los conteos dependen de cuánto registró el profesor, y eso va impreso en el consolidado.",
    "No determina faltas. El reglamento interno exige registro en la hoja de vida y debido proceso.",
    "El mapa de sala muestra dónde pasó, no que el puesto lo cause.",
    "Hubo una corrección durante el diseño: la razón 4:1 de elogios por reprimenda, que suele citarse como norma, no resistió el examen. Una revisión sistemática halló tasas inconsistentes y un análisis sobre 151 salas no encontró umbral. Turnos mide el elogio específico de conducta, que sí tiene respaldo, y no persigue una razón.",
    "Los datos son locales. No se sincronizan entre dispositivos. Savia Educa no los recibe, no los almacena y no puede recuperarlos si el dispositivo se pierde."
  ]);

  s += '<button type="button" class="btn ghost wide" data-act="ir" data-v="inicio">Volver</button>';
  s += '</div></div>';
  return s;
}

/* ---- editor de la sala ---- */
function vistaSala(c){
  var sala = salaDe(c) || { filas:5, cols:6, asientos:{} };
  var ocupados = Object.keys(sala.asientos || {}).filter(function(k){ return sala.asientos[k]; }).length;
  var sp = sinPuesto(c);

  var s = '<header class="topbar"><div class="gut"><div class="toprow">' +
    '<button type="button" class="icon-btn" data-act="ir" data-v="config" aria-label="Volver">' +
    '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
    '<div style="flex:1;min-width:0"><b style="font-family:var(--display);font-size:18px;font-weight:800">Mapa de la sala</b>' +
    '<div style="font-size:12px;color:var(--on-navy-2)">' + h(c.nombre) + ' · ' + ocupados + ' de ' + alumnosDe(c).length + ' ubicados</div></div>' +
    '</div></div></header>';

  s += '<div class="page"><div class="gut">';

  s += '<section class="card"><h3>Tamaño de la sala</h3><div class="sub">Filas desde la pizarra hacia el fondo</div>' +
    '<div style="display:flex;gap:16px;flex-wrap:wrap">' +
    contador("Filas", sala.filas, "filas") + contador("Columnas", sala.cols, "cols") + '</div>' +
    '<div class="btn-row" style="margin-top:13px">' +
    '<button type="button" class="btn sm ghost" data-act="sala-llenar">Llenar en orden de lista</button>' +
    '<button type="button" class="btn sm ghost" data-act="sala-vaciar">Vaciar todo</button></div></section>';

  s += '<section class="card"><h3>Puestos</h3><div class="sub">Toca un puesto para asignar o cambiar al estudiante</div>' +
    '<div class="sala-scroll"><div class="sala-grid" style="grid-template-columns:repeat(' + sala.cols + ',minmax(58px,1fr))">';
  for(var fi = sala.filas - 1; fi >= 0; fi--){
    for(var ci = 0; ci < sala.cols; ci++){
      var key = fi + "-" + ci;
      var aid = (sala.asientos || {})[key];
      var al = aid ? alumno(c, aid) : null;
      s += '<button type="button" class="seat' + (al ? "" : " vacio") + '" data-act="sala-puesto" data-k="' + key + '">' +
        (al ? '<b>' + h(corto(al.nombre)) + '</b>' : '<span>' + (fi+1) + '·' + (ci+1) + '</span>') +
        (al ? '<span class="pos">' + (fi+1) + '·' + (ci+1) + '</span>' : '') + '</button>';
    }
  }
  s += '</div></div><div class="pizarra">Pizarra</div></section>';

  if(sp.length){
    s += '<section class="card"><h3>Sin puesto · ' + sp.length + '</h3>' +
      '<div class="sub">Aparecen igual en la clase, en una fila aparte bajo el mapa</div>' +
      '<div class="chips">' + sp.map(function(a){ return '<span class="chip-n">' + h(corto(a.nombre)) + '</span>'; }).join("") + '</div></section>';
  }

  s += '<div class="aviso">' + iconoInfo() + '<span>Cada registro guarda el puesto del momento, así que puedes reordenar la sala cuando quieras sin que se corrompa el historial.</span></div>';
  s += '</div></div>';
  return s;
}
function contador(etiqueta, valor, campo){

    '<button type="button" class="nom-del" data-act="sala-menos" data-k="' + campo + '" aria-label="Quitar ' + h(etiqueta.toLowerCase()) + '" style="width:40px;height:40px;font-size:18px;font-weight:700">−</button>' +
    '<b class="num" style="font-family:var(--display);font-size:20px;font-weight:800;min-width:24px;text-align:center">' + valor + '</b>' +
    '<button type="button" class="nom-del" data-act="sala-mas" data-k="' + campo + '" aria-label="Agregar ' + h(etiqueta.toLowerCase()) + '" style="width:40px;height:40px;font-size:18px;font-weight:700">+</button>' +
    '</div></div>';
}

/* ---- barrido de práctica ---- */
function vistaBarrido(c){
  var cl = asegurarClase();
  var fase = FASES.filter(function(f){ return f.id === cl.fase; })[0] || FASES[0];
  var marcadas = Object.keys(barrido.marcas).length;
  var total = alumnosDe(c).length;

  var s = '<header class="topbar"><div class="gut">';
  s += '<div class="toprow"><div style="flex:1;min-width:0">' +
    '<b style="font-family:var(--display);font-size:18px;font-weight:800">Barrido de práctica</b>' +
    '<div style="font-size:12px;color:var(--on-navy-2)">' + h(fase.t) + ' · ' + marcadas + ' de ' + total + ' revisados</div></div>' +
    '<button type="button" class="icon-btn" data-act="barrido-cancel" aria-label="Cancelar barrido">' +
    '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></div>';
  s += '</div></header>';

  s += '<div class="gut" style="padding-block:13px 0">';
  s += '<div class="pinceles" role="group" aria-label="Estado a aplicar">';
  BARRIDO.forEach(function(b){
    var on = barrido.pincel === b.id;
    s += '<button type="button" class="pincel" aria-pressed="' + (on?"true":"false") + '" data-act="pincel" data-id="' + b.id + '" ' +
      'style="background:var(--' + b.tok + '-wash);color:var(--' + b.tok + '-ink)">' +
      '<span class="g" style="background:var(--' + b.tok + '-dot);color:var(--surface)">' + b.g + '</span>' +
      '<span style="min-width:0">' + h(b.t) + '</span></button>';
  });
  s += '</div>';
  s += '<p class="dato" style="margin-top:10px">Toca a cada estudiante para aplicarle el estado marcado. Toca de nuevo para borrarlo. Los que no marques quedan como <b>no revisados</b>, que no es lo mismo que no trabajar.</p>';
  s += '</div>';

  s += '<main class="gut"><div class="grid">';
  alumnosDe(c).forEach(function(a){
    var m = barrido.marcas[a.id];
    var b = m ? BAR_BY_ID[m] : null;
    s += '<button type="button" class="tile" data-act="barrido-marca" data-id="' + a.id + '"' +
      (b ? ' style="background:var(--' + b.tok + '-wash);border-color:var(--' + b.tok + '-dot)"' : '') +
      ' aria-label="' + h(corto(a.nombre)) + (b ? ": " + h(b.t) : ": sin revisar") + '">' +
      '<b style="padding-right:16px">' + h(corto(a.nombre)) + '</b>' +
      (b ? '<span class="badge" style="background:var(--' + b.tok + '-dot);color:var(--surface)">' + b.g + '</span>' : '') +
      '</button>';
  });
  s += '</div></main>';

  s += '<div class="footbar"><div class="gut"><div class="meta">' +
    '<small>Sin revisar</small><b class="num">' + (total - marcadas) + (total - marcadas === 1 ? " estudiante" : " estudiantes") + '</b></div>' +
    '<button type="button" class="btn" data-act="barrido-ok"' + (marcadas ? "" : " disabled") + '>Guardar barrido</button></div></div>';
  return s;
}

/* ---- hoja de acciones ---- */
function hojaAcciones(c, alumnoId){
  var cl = asegurarClase();
  var a = alumno(c, alumnoId); if(!a) return "";
  var fase = FASES.filter(function(f){ return f.id === cl.fase; })[0] || FASES[0];
  var hoy = {};
  regsDeClase(cl.id).filter(function(r){ return r.alumnoId === alumnoId; }).forEach(function(r){ hoy[r.accionId] = (hoy[r.accionId]||0)+1; });
  var nHoy = Object.keys(hoy).reduce(function(t,k){ return t + hoy[k]; }, 0);

  var s = '<div class="sheet-bg" data-act="cerrar-hoja"></div><div class="sheet" role="dialog" aria-label="Registrar para ' + h(a.nombre) + '">';
  s += '<div class="sheet-head"><div class="gut"><div class="sheet-title"><div style="min-width:0">' +
    '<h2>' + h(corto(a.nombre)) + '</h2><small>' + h(fase.t) + ' · ' + hora(Date.now()) + ' · ' +
    (nHoy ? nHoy + (nHoy===1?" registro":" registros") + " hoy" : "sin registros hoy") + '</small></div>' +
    '<button type="button" class="icon-btn" data-act="cerrar-hoja" aria-label="Cerrar" style="background:var(--surface-2);color:var(--fg)">' +
    '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></div>';
  if(cl.grupal) s += '<div class="note"><i></i><span>Trabajo grupal activo: lo que marques como fuera de tarea queda con esa marca.</span></div>';
  s += '</div></div>';

  s += '<div class="sheet-body"><div class="gut">';
  FAMILIAS.forEach(function(f){
    s += '<section class="fam"><div class="fam-head"><i style="background:var(--' + f.id + '-dot)"></i><h3>' + h(f.t) + '</h3></div>' +
      '<p>' + h(f.pie) + '</p><div class="acts">';
    ACCIONES.filter(function(x){ return x.f === f.id; }).forEach(function(x){
      s += '<button type="button" class="act" style="background:var(--' + f.id + '-wash);color:var(--' + f.id + '-ink)" data-act="reg" data-id="' + alumnoId + '" data-a="' + x.id + '">' +
        (x.mc && x.id === "p-vol-err" ? estrellaSVG(13, "var(--fdt-dot)") : "") +
        '<span style="min-width:0">' + h(x.t) + '</span>' +
        (hoy[x.id] ? '<span class="hoy">' + hoy[x.id] + '</span>' : '') + '</button>';
    });
    s += '</div></section>';
  });
  s += '</div></div></div>';
  return s;
}

/* ---- vista cierre ---- */
function vistaCierre(c){
  var cl = asegurarClase();
  var regs = regsDeClase(cl.id);
  var pend = regs.filter(function(r){ var a = ACC_BY_ID[r.accionId]; return a && a.otro && !String(r.nota||"").trim(); });
  var sinNada = alumnosDe(c).filter(function(a){ return !regs.some(function(r){ return r.alumnoId === a.id; }); });
  var elogios = regs.filter(function(r){ var a = ACC_BY_ID[r.accionId]; return a && a.elogioEsp; }).length;
  var atenciones = regs.filter(function(r){ return r.accionId === "d-atencion"; }).length;
  var fdt = regs.filter(function(r){ var a = ACC_BY_ID[r.accionId]; return a && a.f === "fdt"; });
  var porFase = {};
  fdt.forEach(function(r){ porFase[r.fase] = (porFase[r.fase]||0)+1; });
  var faseTop = Object.keys(porFase).sort(function(a,b){ return porFase[b]-porFase[a]; })[0];
  var faseTopT = faseTop ? (FASES.filter(function(f){ return f.id === faseTop; })[0]||{}).t : null;
  var prio = prioridad(c, cl);

  var s = "";
  s += '<header class="topbar"><div class="gut"><div class="toprow">' +
    '<button type="button" class="icon-btn" data-act="ir" data-v="clase" aria-label="Volver a la clase">' +
    '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
    '<div style="flex:1;min-width:0"><b style="font-family:var(--display);font-size:17px;font-weight:800">Cierre de clase</b>' +
    '<div style="font-size:12px;color:var(--on-navy-2)">' + h(c.nombre) + ' · ' + fechaLarga(cl.fecha) + ' · ' + hora(Date.now()) + '</div></div>' +
    '</div></div></header>';

  s += '<div class="page"><div class="gut">';

  if(pend.length){
    s += '<section class="card warn"><h3>Pendientes por describir · ' + pend.length + '</h3>' +
      '<div class="sub" style="color:var(--orange-ink)">Marcaste "Otro" durante la clase. Escribe qué pasó antes de cerrar.</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">';
    pend.forEach(function(r){
      var al = alumno(c, r.alumnoId); var a = ACC_BY_ID[r.accionId];
      s += '<div class="pend"><label for="n-' + r.id + '">' + h(corto(al?al.nombre:"")) + ' · ' + h(FAM_BY_ID[a.f].t) + ' · ' + hora(r.ts) + '</label>' +
        '<input type="text" id="n-' + r.id + '" data-nota="' + r.id + '" placeholder="¿Qué pasó?" value="' + h(r.nota||"") + '"></div>';
    });
    s += '</div></section>';
  }

  s += '<section class="card"><h3>Resumen de la clase</h3><div class="sub">' + regs.length + ' registros en ' + alumnosDe(c).length + ' estudiantes</div>' +
    '<div class="stats">' +
    stat(regs.filter(function(r){ var a=ACC_BY_ID[r.accionId]; return a && a.f==="par"; }).length, "registros de participación", "par") +
    stat(sinNada.length, "sin ningún registro", "fdt") +
    stat(elogios, "veces que felicitaste nombrando la conducta", "doc") +
    stat(atenciones, "llamados de atención", "doc") +
    '</div>';
  if(faseTopT && fdt.length) s += '<p style="margin:11px 0 0;font-size:11.5px;line-height:1.45;color:var(--fg-2)">El fuera de tarea se concentró en ' + h(faseTopT) + ': ' + porFase[faseTop] + ' de ' + fdt.length + ' registros.</p>';
  if(sinNada.length) s += '<p style="margin:9px 0 0;font-size:11.5px;line-height:1.45;color:var(--fg-2)">Sin registro hoy: ' + sinNada.map(function(a){ return h(corto(a.nombre)); }).join(", ") + '.</p>';
  s += '</section>';

  s += '<section class="card"><h3>Próxima clase: pregúntale a</h3><div class="sub">El 10% del curso con menos participación</div>';
  prio.forEach(function(p){
    s += '<div class="row"><i></i><b>' + h(corto(p.nombre)) + '</b><small>' + h(razon(p)) + '</small></div>';
  });
  s += '</section>';

  s += '<button type="button" class="btn ghost wide" data-act="ir" data-v="consolidado">Ver el consolidado del curso</button>';

  s += '</div></div>';
  s += '<div class="footbar"><div class="gut">' +
    '<span class="meta" style="font-size:11.5px;line-height:1.35;color:var(--fg-2)">' +
    (pend.length ? "Completa los " + pend.length + " pendientes para cerrar" : "Todo listo. Al cerrar, la clase queda guardada.") + '</span>' +
    '<button type="button" class="btn" data-act="cerrar-clase"' + (pend.length ? " disabled" : "") + '>Guardar y cerrar</button></div></div>';
  return s;
}
function stat(v, t, tok){
  return '<div class="stat" style="background:var(--' + tok + '-wash);color:var(--' + tok + '-ink)"><b>' + v + '</b><small>' + h(t) + '</small></div>';
}

/* ---- consolidado ---- */
var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function rangoPeriodo(p){
  var ahora = new Date();
  if(p === "mes"){
    return { desde:new Date(ahora.getFullYear(), ahora.getMonth(), 1).getTime(), t:MESES[ahora.getMonth()] + " de " + ahora.getFullYear() };
  }
  if(p === "todo"){ return { desde:0, t:"todo el historial" }; }
  var d = new Date(ahora); d.setHours(0,0,0,0);
  var lun = new Date(d); lun.setDate(d.getDate() - (d.getDay() || 7) + 1);
  return { desde:lun.getTime(), t:rangoSemana(ahora).toLowerCase() };
}

function consolidar(c, p){
  var r = rangoPeriodo(p);
  var regs = DB.registros.filter(function(x){ return x.cursoId === c.id && x.ts >= r.desde; });
  var set = {}; regs.forEach(function(x){ set[x.claseId] = true; });
  var A = {};
  alumnosDe(c).forEach(function(a){
    A[a.id] = { id:a.id, n:corto(a.nombre), vol:0, llam:0, fdt:0, motor:0, verbal:0, pasivo:0,
                noIni:0, noResp:0, aten:0, explica:0, daResp:0, aplica:0, total:0, acc:{},
                bar:{ ok:0, err:0, av:0, no:0, tot:0 } };
  });
  var barridos = DB.barridos.filter(function(b){ return b.cursoId === c.id && b.ts >= r.desde; });
  var barTot = { ok:0, err:0, av:0, no:0 };
  barridos.forEach(function(b){
    Object.keys(b.marcas || {}).forEach(function(aid){
      var o = A[aid], e = b.marcas[aid];
      if(!o || o.bar[e] === undefined) return;
      o.bar[e]++; o.bar.tot++; barTot[e]++;
    });
  });
  var elogEsp = 0, elogGen = 0, norma = 0, fasesFdt = {}, totExplica = 0, totDaResp = 0, totAplica = 0;
  regs.forEach(function(x){
    var a = ACC_BY_ID[x.accionId], o = A[x.alumnoId];
    if(!a || !o) return;
    o.total++;
    o.acc[x.accionId] = (o.acc[x.accionId] || 0) + 1;
    if(a.f === "par"){ if(a.k === "voluntaria") o.vol++; if(a.k === "llamada") o.llam++; }
    if(a.f === "fdt"){ o.fdt++; if(a.boss) o[a.boss]++; fasesFdt[x.fase] = (fasesFdt[x.fase]||0)+1; }
    if(x.accionId === "f-noini") o.noIni++;
    if(x.accionId === "p-dir-no") o.noResp++;
    if(x.accionId === "d-atencion") o.aten++;
    if(x.accionId === "d-elog-esp") elogEsp++;
    if(x.accionId === "d-elog-gen") elogGen++;
    if(x.accionId === "d-norma") norma++;
    if(x.accionId === "e-explica"){ o.explica++; totExplica++; }
    if(x.accionId === "e-da-resp"){ o.daResp++; totDaResp++; }
    if(x.accionId === "e-aplica"){ o.aplica++; totAplica++; }
  });
  var arr = Object.keys(A).map(function(k){ return A[k]; });
  arr.forEach(function(o){ o.turnos = o.vol + o.llam; o.noSigue = o.noIni + o.noResp + o.aten; });
  var totTurnos = arr.reduce(function(s,o){ return s + o.turnos; }, 0);
  var orden = arr.slice().sort(function(a,b){ return b.turnos - a.turnos; });
  var tercio = Math.max(1, Math.ceil(arr.length / 3));
  var concTurnos = totTurnos ? Math.round(orden.slice(0,tercio).reduce(function(s,o){ return s + o.turnos; }, 0) / totTurnos * 100) : 0;
  var totLlam = arr.reduce(function(s,o){ return s + o.llam; }, 0);
  var ordLlam = arr.slice().sort(function(a,b){ return b.llam - a.llam; });
  var concLlam = totLlam ? Math.round(ordLlam.slice(0,tercio).reduce(function(s,o){ return s + o.llam; }, 0) / totLlam * 100) : 0;
  var faseTop = Object.keys(fasesFdt).sort(function(a,b){ return fasesFdt[b] - fasesFdt[a]; })[0];
  return {
    etiqueta:r.t, regs:regs, nClases:Object.keys(set).length, nRegs:regs.length, arr:arr, orden:orden,
    sinNada:arr.filter(function(o){ return !o.total; }), totTurnos:totTurnos, concTurnos:concTurnos,
    concLlam:concLlam, tercio:tercio, nuncaLlamados:arr.filter(function(o){ return !o.llam; }),
    elogEsp:elogEsp, elogGen:elogGen, norma:norma, faseTop:faseTop, fasesFdt:fasesFdt,
    totFdt:arr.reduce(function(s,o){ return s + o.fdt; }, 0),
    totExplica:totExplica, totDaResp:totDaResp, totAplica:totAplica,
    barridos:barridos, barTot:barTot
  };
}

function barras(items, tok, n){
  var top = items.filter(function(x){ return x.v > 0; }).slice(0, n || 6);
  if(!top.length) return '<p class="vacio">Sin registros de este tipo en el periodo.</p>';
  var max = top[0].v || 1;
  return top.map(function(x){
    var pct = Math.max(5, Math.round(x.v / max * 100));
    return '<div class="bar-row"><div class="bar-top"><span class="bar-n">' + h(x.n) + '</span><span class="bar-v">' + x.v + '</span></div>' +
      '<div class="bar-track"><i style="width:' + pct + '%;background:var(--' + tok + '-dot)"></i></div>' +
      (x.d ? '<div class="bar-d">' + h(x.d) + '</div>' : '') + '</div>';
  }).join("");
}

  s += '<section class="card"><h3>Los invisibles</h3><div class="sub">Los que menos aparecieron en el periodo</div>';

    return '<div class="row"><i style="background:var(--' + (o.turnos ? "par" : "fdt") + '-dot)"></i><b>' + h(o.n) + '</b>' +
      '<small>' + (o.turnos ? o.turnos + (o.turnos === 1 ? " turno" : " turnos") + " en " + k.nClases + (k.nClases === 1 ? " clase" : " clases") : "sin participar en todo el periodo") + '</small></div>';
  }).join("");
  s += '<p class="dato">El tercio más activo del curso (' + k.tercio + ' estudiantes) se lleva el <b>' + k.concTurnos + '%</b> de los turnos. Si fuera parejo sería 33%.</p>' +

      'La evidencia dice que quien explica con elaboración es el que más aprende, y que el que recibe solo gana si aplica la ayuda: eso pasó <b>' + k.totAplica + '</b> veces.</p>';

      { n:"Recordaste la norma antes de la falta", v:k.norma }
    ], "doc", 3);
  s += '<p class="dato">Tus llamadas directas se concentran en el tercio más llamado en un <b>' + k.concLlam + '%</b>.</p>' +

  if(k.nuncaLlamados.length){
